name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Helm for the chart checks: the same release and SHA-256 as the
  # tools.lock of gke-llm-inference-platform.
  HELM_URL: https://get.helm.sh/helm-v3.21.0-linux-amd64.tar.gz
  HELM_SHA256: 0093eb572e3d2380f094df162ddb525e219249de88957afe24cfbb19632acd36
  # KEDA for the keda job: the chart by version and SHA-256, and its three
  # images by digest (the chart defaults them to a tag), so the release
  # under test cannot move.
  KEDA_CHART_URL: https://kedacore.github.io/charts/keda-2.21.0.tgz
  KEDA_CHART_SHA256: a7da56bf41a33dad9d2fc82a6fdecee552fff947d80bf1e1dbcf4db0f9e26dee
  KEDA_IMAGE_KEDA: 2.21.0@sha256:81fe6547ce8d1cc29273f887b76507e9b853e5bc1f875ec23fe60061a38ed809
  KEDA_IMAGE_METRICS: 2.21.0@sha256:255375037fe592732eeb554743aae360c2da88cf0b9b1258d0a987ef885f0881
  KEDA_IMAGE_WEBHOOKS: 2.21.0@sha256:e1969628cca6123e32eea13c47c75817091af2657fa68d9d0d58a8620d1b75b1
  # The KEDA HTTP add-on for the scale-from-zero job, next to KEDA: the
  # chart by version and SHA-256, and its three images by digest. One
  # chart tag covers all three images, so hack/keda-http-install.sh sets
  # each digest after the install.
  KEDA_HTTP_CHART_URL: https://kedacore.github.io/charts/keda-add-ons-http-0.16.0.tgz
  KEDA_HTTP_CHART_SHA256: 363f7250851f948661f7301c7e3bcb33c2cf19f4e26e2247f71ae61d339abe82
  KEDA_HTTP_IMAGE_OPERATOR: 0.16.0@sha256:2ae0076d549fb7d12b3d9ecb1e87d035c7ee73e94a640ff53842e70ab0824da0
  KEDA_HTTP_IMAGE_INTERCEPTOR: 0.16.0@sha256:3a9a454b949edd5dee711ed14e603cc3b91b7c065905ecc251fe0a56a4c026f1
  KEDA_HTTP_IMAGE_SCALER: 0.16.0@sha256:db5223b1a37521ec0f099ac04785bfc069f5c3ebf4bacffd04e5127b0876dffb

jobs:
  check:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain pins agree
        # rust-toolchain.toml is the one declaration of the Rust version. The
        # action refs in the workflows, the Dockerfile builder tag and the
        # rust-version in Cargo.toml cannot read it, so this step fails as
        # soon as any of them drifts from it.
        run: |
          ch=$(sed -n 's/^channel = "\([0-9.]*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$ch" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          re=${ch//./\\.}
          bad=0
          refs=$(grep -hoE '^[[:space:]-]*uses: dtolnay/rust-toolchain@[^[:space:]]+' .github/workflows/*.yml | sed 's/^[[:space:]-]*uses: //' | sort -u | paste -sd' ' -)
          [ "$refs" = "dtolnay/rust-toolchain@$ch" ] || { echo "::error::workflow toolchain refs [$refs] differ from channel $ch"; bad=1; }
          grep -q "^FROM mirror\.gcr\.io/library/rust:${re}-" Dockerfile || { echo "::error::Dockerfile builder is not mirror.gcr.io/library/rust:${ch}-*"; bad=1; }
          rv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          [ "$rv" = "$ch" ] || { echo "::error::Cargo.toml rust-version $rv differs from channel $ch"; bad=1; }
          [ "$bad" = 0 ] && echo "toolchain pins agree on $ch"
          exit $bad

      - name: Build images avoid Docker Hub
        # A Docker Hub outage could stop the release build before any
        # Dockerfile line ran: the BuildKit builder, the Dockerfile frontend and
        # the Rust base all came from there. They come from mirror.gcr.io, and
        # the two that decide what the image contains are pinned by digest, so
        # a stale mirror fails the build instead of changing it.
        run: |
          bad=0
          grep -qE '^# syntax=mirror\.gcr\.io/docker/dockerfile:[0-9.]+@sha256:[0-9a-f]{64}$' Dockerfile || { echo "::error::Dockerfile frontend is not mirror.gcr.io/docker/dockerfile pinned by digest"; bad=1; }
          grep -qE '^FROM mirror\.gcr\.io/library/rust:[^ @]+@sha256:[0-9a-f]{64} AS builder$' Dockerfile || { echo "::error::Dockerfile builder is not mirror.gcr.io/library/rust pinned by digest"; bad=1; }
          grep -qE '^ +driver-opts: image=mirror\.gcr\.io/moby/buildkit:' .github/workflows/release-image.yml || { echo "::error::release builds do not take BuildKit from mirror.gcr.io"; bad=1; }
          [ "$bad" = 0 ] && echo "build images come from mirror.gcr.io; frontend and builder pinned by digest"
          exit $bad

      - name: Release versions agree
        # Cargo.toml, the chart version and the chart appVersion name the same
        # release. A tag that moves one without the others ships a chart that
        # installs a different binary from the one it describes.
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          chart_v=$(sed -n 's/^version: //p' chart/Chart.yaml)
          app_v=$(sed -n 's/^appVersion: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' chart/Chart.yaml)
          [ -n "$cargo_v" ] || { echo "::error::no package version in Cargo.toml"; exit 1; }
          bad=0
          [ "$chart_v" = "$cargo_v" ] || { echo "::error::chart version $chart_v differs from Cargo.toml $cargo_v"; bad=1; }
          [ "$app_v" = "$cargo_v" ] || { echo "::error::chart appVersion $app_v differs from Cargo.toml $cargo_v"; bad=1; }
          [ "$bad" = 0 ] && echo "release versions agree on $cargo_v"
          exit $bad

      - name: Chart defaults install the chart's own image
        # v0.3.0 shipped a chart whose default image was 0.2.1: CRDs for the
        # fleet layer, a binary without it. With every default, the operator
        # and the reporter must both render repository:appVersion.
        run: |
          curl -fsSL -o /tmp/helm.tgz "$HELM_URL"
          echo "$HELM_SHA256  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          repo=$(sed -n 's/^  repository: //p' chart/values.yaml)
          app_v=$(sed -n 's/^appVersion: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' chart/Chart.yaml)
          want="$repo:$app_v"
          got=$(/tmp/linux-amd64/helm template t chart --set reporter.enabled=true --set example.enabled=false | sed -n 's/^[[:space:]]*image: "\(.*\)"$/\1/p')
          n=$(printf '%s\n' "$got" | grep -c .)
          uniq=$(printf '%s\n' "$got" | sort -u | paste -sd' ' -)
          [ "$n" = 2 ] && [ "$uniq" = "$want" ] || { echo "::error::chart defaults render $n image line(s) [$uniq], want 2 x $want"; exit 1; }
          echo "operator and reporter both render $want"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

  e2e:
    name: end-to-end on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build operator and crdgen
        run: cargo build --bins

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: e2e

      - name: CRDs committed match the generator
        # This job used to regenerate deploy/crd.yaml in place and carry on, so
        # e2e always ran against a fresh schema while the committed files could
        # sit stale for weeks — and anyone installing the chart got the old one.
        # The phase C rehearsal found exactly that: three fields added to the
        # types were missing from both copies, and the API server rejected them.
        run: |
          cargo run --bin crdgen > /tmp/crd-generated.yaml
          for f in deploy/crd.yaml chart/crds/crd.yaml; do
            if ! diff -q /tmp/crd-generated.yaml "$f" >/dev/null; then
              echo "::error::$f is stale — run: cargo run --bin crdgen > $f"
              diff /tmp/crd-generated.yaml "$f" | head -40
              exit 1
            fi
          done
          echo "both CRD copies match the generator"
      - name: Install CRD
        run: |
          kubectl apply -f deploy/crd.yaml
          kubectl wait --for=condition=Established crd/vllmservices.inference.michelecampi.dev --timeout=30s

      - name: Start operator in background
        run: |
          ./target/debug/vllm-coldstart-operator > operator.log 2>&1 &
          echo $! > operator.pid
          sleep 3
          echo "operator started (pid $(cat operator.pid))"

      - name: Apply a VllmService
        run: kubectl apply -f deploy/examples/ci-placeholder.yaml

      - name: Wait for Deployment to be created
        run: |
          for i in $(seq 1 30); do
            if kubectl get deployment ci-placeholder >/dev/null 2>&1; then
              echo "Deployment created after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Deployment not created within 30s"
          kubectl get all
          cat operator.log
          exit 1

      - name: Wait for status to reach Ready
        run: |
          for i in $(seq 1 60); do
            phase=$(kubectl get vllmservice ci-placeholder -o jsonpath='{.status.phase}' 2>/dev/null || true)
            echo "[$i] phase=${phase:-<none>}"
            if [ "$phase" = "Ready" ]; then
              echo "VllmService reached Ready after ${i}s"
              kubectl get vllmservice ci-placeholder -o jsonpath='{.status.message}'
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: VllmService did not reach Ready within 120s"
          kubectl get vllmservice ci-placeholder -o yaml
          cat operator.log
          exit 1

      - name: Verify owner reference and garbage collection
        run: |
          owner=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.ownerReferences[0].kind}')
          [ "$owner" = "VllmService" ] || { echo "ERROR: bad owner ref: $owner"; exit 1; }
          kubectl delete vllmservice ci-placeholder
          for i in $(seq 1 30); do
            if ! kubectl get deployment ci-placeholder >/dev/null 2>&1; then
              echo "Deployment garbage-collected after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Deployment not garbage-collected within 30s"
          exit 1

      - name: Start the reporter, which creates the NodeState the fleet planner reads
        run: |
          # Without a NodeState carrying a status the fleet controller logs "no
          # reported NodeState objects, nothing to place" and places nothing — a
          # fleet e2e without one asserts on a system that was never asked to do
          # anything. The reporter creates it and writes the status fields it
          # owns, here from its synthetic source; hack/e2e-reporter.sh then
          # writes the warmth, which the reporter does not own.
          #
          # The name must be the real node's: the child VllmService is pinned
          # with a kubernetes.io/hostname nodeSelector (ADR-0004), so a fixed
          # name in a manifest schedules nothing the moment the cluster is
          # named differently. Rehearsed locally on 2026-08-06, where exactly
          # that produced FailedScheduling for 90s. The script takes the name
          # from the cluster.
          bash hack/e2e-reporter.sh start
          # The status is merge-patched by writers with disjoint field
          # ownership (NodeStateStatus, src/fleet_types.rs): the reporter's
          # next report must leave the warmth just written in place.
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          t1=$(kubectl get nodestate "$NODE" -o jsonpath='{.status.lastReportTime}')
          t2="$t1"
          for i in $(seq 1 30); do
            t2=$(kubectl get nodestate "$NODE" -o jsonpath='{.status.lastReportTime}')
            [ "$t2" != "$t1" ] && break
            sleep 1
          done
          [ "$t2" != "$t1" ] || { echo "ERROR: no second report within 30s"; cat reporter.log; exit 1; }
          w=$(kubectl get nodestate "$NODE" -o jsonpath='{.status.warmth}')
          [ "$w" = "Warm" ] || { echo "ERROR: warmth is '$w' after the report at $t2, want Warm"; exit 1; }
          echo "the report at $t2 left warmth Warm"
      - name: Apply a FleetService and wait for Ready
        run: |
          kubectl apply -f deploy/examples/ci-fleet.yaml
          for i in $(seq 1 40); do
            phase=$(kubectl get fleetservice ci-fleet -o jsonpath='{.status.phase}' 2>/dev/null || true)
            ready=$(kubectl get fleetservice ci-fleet -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
            echo "[$i] phase=${phase:-<none>} ready=${ready:-<none>}"
            if [ "$phase" = "Ready" ] && [ "$ready" = "1" ]; then
              echo "FleetService reached Ready after ~$((i*3))s"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: FleetService did not reach Ready within 120s"
          kubectl get fleetservice ci-fleet -o yaml
          kubectl get vllmservice -o yaml
          kubectl describe pods
          cat operator.log
          exit 1
      - name: kubectl shows fleet and node state in its default columns
        # The CRDs declare printer columns. A wrong jsonPath leaves a column
        # empty without any error, so assert on the values, not the headers.
        run: |
          kubectl get fleetservice ci-fleet
          set -- $(kubectl get fleetservice ci-fleet --no-headers)
          [ "$2" = "Ready" ] && [ "$3" = "1" ] && [ "$4" = "1" ] && [ "$5" = "0" ] || { echo "::error::fleetservice columns show [$*], want PHASE=Ready DESIRED=1 READY=1 WARMING=0"; exit 1; }
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          kubectl get nodestate "$NODE"
          set -- $(kubectl get nodestate "$NODE" --no-headers)
          [ "$2" = "Warm" ] || { echo "::error::nodestate columns show [$*], want WARMTH=Warm"; exit 1; }

      - name: Verify the child is owned and pinned
        run: |
          # Two properties the VllmService e2e cannot reach: the fleet owns
          # its children (so deleting a fleet does not orphan capacity), and
          # the planner's choice actually reaches the pod spec. A placement
          # that plans correctly but does not pin schedules anywhere, which
          # is the failure the 3xA10 item-4 rehearsal was built to catch.
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          owner=$(kubectl get vllmservice ci-fleet-0 -o jsonpath='{.metadata.ownerReferences[0].kind}')
          [ "$owner" = "FleetService" ] || { echo "ERROR: bad owner ref: $owner"; exit 1; }
          pin=$(kubectl get vllmservice ci-fleet-0 -o jsonpath='{.spec.nodeName}')
          [ "$pin" = "$NODE" ] || { echo "ERROR: child pinned to '$pin', node is '$NODE'"; exit 1; }
          echo "child owned by FleetService and pinned to $pin"
      - name: Verify the scale subresource
        run: |
          # ADR-0009 puts replicas on the scale subresource so an external
          # autoscaler can drive the fleet. Nothing tested that path before.
          kubectl scale fleetservice ci-fleet --replicas=2
          for i in $(seq 1 20); do
            n=$(kubectl get fleetservice ci-fleet -o jsonpath='{.status.replicas}' 2>/dev/null || true)
            echo "[$i] status.replicas=${n:-<none>}"
            if [ "$n" = "2" ]; then echo "scale reflected after ~$((i*2))s"; exit 0; fi
            sleep 2
          done
          echo "ERROR: scale to 2 not reflected in status.replicas within 40s"
          kubectl get fleetservice ci-fleet -o yaml
          cat operator.log
          exit 1
      - name: Verify fleet garbage collection
        run: |
          kubectl delete fleetservice ci-fleet
          for i in $(seq 1 30); do
            n=$(kubectl get vllmservice --no-headers 2>/dev/null | wc -l)
            if [ "$n" = "0" ]; then echo "children garbage-collected after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "ERROR: fleet children not garbage-collected within 30s"
          kubectl get vllmservice -o yaml
          exit 1
      - name: The node pool selector decides where a fleet may place
        # A selector no node satisfies must place nothing; one the node
        # satisfies must place there. The label is read from the node kind
        # runs, not written into the manifest: its value can differ from the
        # node name on other platforms.
        run: |
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          HOST=$(kubectl get node "$NODE" -o jsonpath='{.metadata.labels.kubernetes\.io/hostname}')
          [ -n "$HOST" ] || { echo "ERROR: node $NODE has no kubernetes.io/hostname label"; exit 1; }
          fleet() {
            kubectl apply -f - <<EOF
          apiVersion: inference.michelecampi.dev/v1alpha1
          kind: FleetService
          metadata:
            name: $1
            namespace: default
          spec:
            model: ci-placeholder-model
            replicas: 1
            nodePool:
              selector:
                "$2": "$3"
            template:
              gpu: 0
              healthPath: ""
              image: registry.k8s.io/pause:3.10
          EOF
          }

          fleet ci-fleet-nomatch vcso.ci/pool none
          phase=""
          for i in $(seq 1 20); do
            phase=$(kubectl get fleetservice ci-fleet-nomatch -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ -n "$phase" ] && break
            sleep 1
          done
          [ "$phase" = "Placing" ] || { echo "ERROR: ci-fleet-nomatch phase is '$phase', want Placing"; exit 1; }
          placed=$(kubectl get fleetservice ci-fleet-nomatch -o jsonpath='{.status.placements[*].nodeRef}')
          [ -z "$placed" ] || { echo "ERROR: ci-fleet-nomatch placed on '$placed'"; exit 1; }
          if kubectl get vllmservice ci-fleet-nomatch-0 >/dev/null 2>&1; then
            echo "ERROR: ci-fleet-nomatch created a child"; exit 1
          fi
          grep -q "node pool selector .* admits none of" operator.log || { echo "ERROR: no selector warning in operator.log"; exit 1; }

          fleet ci-fleet-match kubernetes.io/hostname "$HOST"
          phase=""
          for i in $(seq 1 40); do
            phase=$(kubectl get fleetservice ci-fleet-match -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$phase" = "Ready" ] && break
            sleep 3
          done
          [ "$phase" = "Ready" ] || { echo "ERROR: ci-fleet-match phase is '$phase', want Ready"; exit 1; }
          pin=$(kubectl get vllmservice ci-fleet-match-0 -o jsonpath='{.spec.nodeName}')
          [ "$pin" = "$NODE" ] || { echo "ERROR: ci-fleet-match child pinned to '$pin', node is '$NODE'"; exit 1; }
          placed=$(kubectl get fleetservice ci-fleet-match -o jsonpath='{.status.placements[*].nodeRef}')
          [ "$placed" = "$NODE" ] || { echo "ERROR: ci-fleet-match placements report '$placed', node is '$NODE'"; exit 1; }

          kubectl delete fleetservice ci-fleet-nomatch ci-fleet-match --wait=true
          echo "selector placed nothing for ci-fleet-nomatch and placed ci-fleet-match on $NODE"

      - name: Node warmth is derived from what the cluster runs (ADR-0011 D1)
        # The fleet's own replica must not warm its node for that fleet (the
        # ADR-0011 postscript); a pinned VllmService of the same model must.
        # The node's NodeState is set Cold first, so a Warm in decidedOn can
        # only be the derived value; it goes back to Warm for the steps below.
        run: |
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          kubectl patch nodestate "$NODE" --subresource=status --type=merge -p '{"status":{"warmth":"Cold"}}'
          warmth_of() {
            kubectl get fleetservice d1-fleet -o jsonpath="{.status.placements[?(@.vllmServiceRef==\"$1\")].decidedOn.warmth}"
          }
          wait_slot() {
            for i in $(seq 1 40); do
              w=$(warmth_of "$1")
              if [ -n "$w" ]; then echo "$w"; return 0; fi
              sleep 3
            done
            echo "ERROR: no decidedOn for $1" >&2
            return 1
          }

          kubectl apply -f - <<EOF
          apiVersion: inference.michelecampi.dev/v1alpha1
          kind: FleetService
          metadata:
            name: d1-fleet
            namespace: default
          spec:
            model: d1-model
            replicas: 1
            template:
              gpu: 0
              healthPath: ""
              image: registry.k8s.io/pause:3.10
          EOF
          w0=$(wait_slot d1-fleet-0)
          [ "$w0" = "Cold" ] || { echo "ERROR: slot 0 decided on '$w0', want Cold"; exit 1; }
          kubectl wait --for=jsonpath='{.status.phase}'=Ready vllmservice/d1-fleet-0 --timeout=120s

          kubectl scale fleetservice d1-fleet --replicas=2
          w1=$(wait_slot d1-fleet-1)
          [ "$w1" = "Cold" ] || { echo "ERROR: slot 1 decided on '$w1' with only the fleet's own replica on $NODE, want Cold"; exit 1; }

          kubectl apply -f - <<EOF
          apiVersion: inference.michelecampi.dev/v1alpha1
          kind: VllmService
          metadata:
            name: d1-standalone
            namespace: default
          spec:
            model: d1-model
            replicas: 1
            warmupStrategy: Eager
            image: "registry.k8s.io/pause:3.10"
            gpu: 0
            healthPath: ""
            nodeName: $NODE
          EOF
          kubectl wait --for=jsonpath='{.status.phase}'=Ready vllmservice/d1-standalone --timeout=120s

          kubectl scale fleetservice d1-fleet --replicas=3
          w2=$(wait_slot d1-fleet-2)
          [ "$w2" = "Warm" ] || { echo "ERROR: slot 2 decided on '$w2' with a Ready d1-model service pinned to $NODE, want Warm"; exit 1; }

          kubectl delete fleetservice d1-fleet --wait=true
          kubectl delete vllmservice d1-standalone --wait=true
          kubectl patch nodestate "$NODE" --subresource=status --type=merge -p '{"status":{"warmth":"Warm"}}'
          echo "slots 0 and 1 decided Cold (the fleet's own replica does not count), slot 2 Warm (a pinned d1-model service)"

      - name: A fleet with no candidate says why in its status (ADR-0011 D4)
        # With no NodeState the fleet has no candidate. It must still publish
        # a phase and a message, and the message must clear once a candidate
        # appears. The reporter is stopped first, so nothing recreates the
        # NodeState meanwhile, and started again as the seed step started it.
        run: |
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          bash hack/e2e-reporter.sh stop
          kubectl delete nodestate "$NODE" --wait=true
          kubectl apply -f - <<EOF
          apiVersion: inference.michelecampi.dev/v1alpha1
          kind: FleetService
          metadata:
            name: d4-fleet
            namespace: default
          spec:
            model: d4-model
            replicas: 1
            template:
              gpu: 0
              healthPath: ""
              image: registry.k8s.io/pause:3.10
          EOF
          phase=""
          for i in $(seq 1 20); do
            phase=$(kubectl get fleetservice d4-fleet -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ -n "$phase" ] && break
            sleep 1
          done
          [ "$phase" = "Placing" ] || { echo "ERROR: phase is '$phase', want Placing"; exit 1; }
          msg=$(kubectl get fleetservice d4-fleet -o jsonpath='{.status.message}')
          case "$msg" in *"no candidate node"*) ;; *) echo "ERROR: message is '$msg'"; exit 1 ;; esac
          kubectl get fleetservice d4-fleet -o wide | head -n 1 | grep -q MESSAGE || { echo "ERROR: no MESSAGE column with -o wide"; exit 1; }
          if kubectl get vllmservice d4-fleet-0 >/dev/null 2>&1; then
            echo "ERROR: d4-fleet placed with no candidate"; exit 1
          fi

          bash hack/e2e-reporter.sh start
          msg="unset"; placed=""
          for i in $(seq 1 40); do
            msg=$(kubectl get fleetservice d4-fleet -o jsonpath='{.status.message}')
            placed=$(kubectl get fleetservice d4-fleet -o jsonpath='{.status.placements[*].nodeRef}')
            [ -z "$msg" ] && [ "$placed" = "$NODE" ] && break
            sleep 3
          done
          [ -z "$msg" ] || { echo "ERROR: message '$msg' still set once a candidate exists"; exit 1; }
          [ "$placed" = "$NODE" ] || { echo "ERROR: placements report '$placed' once a candidate exists"; exit 1; }
          kubectl delete fleetservice d4-fleet --wait=true
          echo "no candidate: Placing with a message; once a NodeState exists the fleet places and the message clears"

      - name: The node pool selector defines the candidates (ADR-0011 D3)
        # With a selector the candidates are the Nodes it admits, so a fleet
        # places with no NodeState at all; a cordoned Node is no candidate.
        # The reporter is stopped first, so nothing recreates the NodeState
        # meanwhile, and started again at the end as the seed step started it.
        run: |
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          HOST=$(kubectl get node "$NODE" -o jsonpath='{.metadata.labels.kubernetes\.io/hostname}')
          [ -n "$HOST" ] || { echo "ERROR: node $NODE has no kubernetes.io/hostname label"; exit 1; }
          bash hack/e2e-reporter.sh stop
          kubectl delete nodestate "$NODE" --wait=true
          fleet() {
            kubectl apply -f - <<EOF
          apiVersion: inference.michelecampi.dev/v1alpha1
          kind: FleetService
          metadata:
            name: $1
            namespace: default
          spec:
            model: d3-model
            replicas: 1
            nodePool:
              selector:
                "kubernetes.io/hostname": "$HOST"
            template:
              gpu: 0
              healthPath: ""
              image: registry.k8s.io/pause:3.10
          EOF
          }

          fleet d3-fleet
          phase=""
          for i in $(seq 1 40); do
            phase=$(kubectl get fleetservice d3-fleet -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$phase" = "Ready" ] && break
            sleep 3
          done
          [ "$phase" = "Ready" ] || { echo "ERROR: d3-fleet phase is '$phase' with no NodeState, want Ready"; exit 1; }
          pin=$(kubectl get vllmservice d3-fleet-0 -o jsonpath='{.spec.nodeName}')
          [ "$pin" = "$NODE" ] || { echo "ERROR: d3-fleet child pinned to '$pin', node is '$NODE'"; exit 1; }

          kubectl cordon "$NODE"
          fleet d3-cordoned
          phase=""
          for i in $(seq 1 20); do
            phase=$(kubectl get fleetservice d3-cordoned -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ -n "$phase" ] && break
            sleep 1
          done
          msg=$(kubectl get fleetservice d3-cordoned -o jsonpath='{.status.message}')
          [ "$phase" = "Placing" ] || { echo "ERROR: d3-cordoned phase is '$phase', want Placing"; exit 1; }
          case "$msg" in *"admits none of the schedulable Nodes"*) ;; *) echo "ERROR: d3-cordoned message is '$msg'"; exit 1 ;; esac
          if kubectl get vllmservice d3-cordoned-0 >/dev/null 2>&1; then
            echo "ERROR: d3-cordoned placed on a cordoned node"; exit 1
          fi
          # Uncordon only after the checks: a schedulable node is a valid candidate again.
          kubectl uncordon "$NODE"

          kubectl delete fleetservice d3-fleet d3-cordoned --wait=true
          bash hack/e2e-reporter.sh start
          echo "with no NodeState d3-fleet placed on $NODE through the selector; cordoned, the node was no candidate"

      - name: Restart the operator over live children
        run: |
          # ADR-0008 lists "no upgrade path exercised" among the non-goals.
          # The property an operator has to have and nobody had checked here:
          # a new process picks up existing children instead of recreating
          # them. Reconcile applies server-side onto deterministic names with
          # an owner reference derived from the CR (src/main.rs), so adoption
          # should be transparent — "should" being exactly what makes it worth
          # a test. Recreation would mean every operator upgrade cycles every
          # replica in the fleet, which is the difference between a rolling
          # upgrade and an outage.
          kubectl apply -f deploy/examples/ci-placeholder.yaml
          for i in $(seq 1 30); do
            kubectl get deployment ci-placeholder >/dev/null 2>&1 && break
            sleep 1
          done
          UID_BEFORE=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.uid}')
          GEN_BEFORE=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.generation}')
          echo "before restart: uid=$UID_BEFORE generation=$GEN_BEFORE"

          kill "$(cat operator.pid)"
          sleep 3
          ./target/debug/vllm-coldstart-operator > operator-restarted.log 2>&1 &
          echo $! > operator.pid
          sleep 10

          UID_AFTER=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.uid}')
          GEN_AFTER=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.generation}')
          echo "after restart:  uid=$UID_AFTER generation=$GEN_AFTER"

          [ "$UID_BEFORE" = "$UID_AFTER" ] || {
            echo "ERROR: Deployment was recreated across the restart"
            echo "       (uid $UID_BEFORE -> $UID_AFTER). Every operator"
            echo "       upgrade would cycle every replica."
            cat operator-restarted.log
            exit 1
          }
          # Generation bumps only on a spec change. A restart that rewrites
          # the spec identically must not bump it: if it does, the apply is
          # not idempotent and every restart is a rollout.
          [ "$GEN_BEFORE" = "$GEN_AFTER" ] || {
            echo "ERROR: generation moved $GEN_BEFORE -> $GEN_AFTER on a"
            echo "       restart with no spec change — the apply is not"
            echo "       idempotent and each restart triggers a rollout."
            kubectl get deployment ci-placeholder -o yaml
            cat operator-restarted.log
            exit 1
          }
          echo "operator restart adopted the child without recreating it"
      - name: Pin the selector immutability constraint
        run: |
          # ADR-0008 fact 3: a Deployment's selector is immutable after
          # creation, so any version that adds a key to the LabelSelector
          # that build_deployment writes breaks apply on every Deployment
          # that already exists. Fleet membership (ADR-0014) is therefore a
          # label on the pod template only: the selector and the Deployment
          # metadata keep the `labels` map, and the template gets a copy with
          # the fleet key added (src/main.rs, pod_labels).
          #
          # This step does not test the operator. It pins the constraint the
          # operator has to evolve within, by proving the API server rejects
          # exactly the change a careless version would make. A note in an ADR
          # asks to be remembered; a failing apply asks nothing.
          set +e
          out=$(kubectl patch deployment ci-placeholder --type=merge \
            -p '{"spec":{"selector":{"matchLabels":{"app":"ci-placeholder","inference.michelecampi.dev/fleet":"x"}}}}' 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ $rc -ne 0 ] || {
            echo "ERROR: the API server accepted a selector change."
            echo "       Either this cluster does not enforce selector"
            echo "       immutability, or the patch did not reach the field —"
            echo "       both make this step meaningless and it must be fixed"
            echo "       rather than left passing."
            exit 1
          }
          echo "$out" | grep -qi 'immutable\|invalid' || {
            echo "ERROR: apply failed for some reason other than immutability"
            exit 1
          }
          echo "selector immutability confirmed: adding a key to the selector"
          echo "is a breaking change for existing Deployments, and a version"
          echo "that needs one has to migrate rather than apply"
      - name: Reporter log on failure
        if: failure()
        run: cat reporter.log || true
      - name: Stop reporter
        if: always()
        run: bash hack/e2e-reporter.sh stop || true
      - name: Stop operator
        if: always()
        run: kill "$(cat operator.pid)" 2>/dev/null || true

  chart-install:
    name: chart install on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the operator image
        # Tagged repository:appVersion, the reference the chart's defaults
        # render, so the install below needs no image override.
        run: |
          repo=$(sed -n 's/^  repository: //p' chart/values.yaml)
          app_v=$(sed -n 's/^appVersion: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' chart/Chart.yaml)
          img="$repo:$app_v"
          docker build -t "$img" .
          echo "IMG=$img" >> "$GITHUB_ENV"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: chart

      - name: Load the image into the node
        run: kind load docker-image "$IMG" --name chart

      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/helm.tgz "$HELM_URL"
          echo "$HELM_SHA256  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm

      - name: Install the chart with its defaults
        run: /tmp/linux-amd64/helm install vcso chart --namespace vllm-system --create-namespace --wait --timeout 5m

      - name: Wait for the example VllmService to be Ready
        run: kubectl wait vllmservice/ci-placeholder -n vllm-system --for=jsonpath='{.status.phase}'=Ready --timeout=120s

      - name: kubectl shows the phase in its default columns
        # The CRDs declare printer columns. A wrong jsonPath leaves a column
        # empty without any error, so assert on the values, not the headers.
        run: |
          kubectl get vllmservice ci-placeholder -n vllm-system
          set -- $(kubectl get vllmservice ci-placeholder -n vllm-system --no-headers)
          [ "$2" = "Ready" ] && [ "$3" = "placeholder/ci-test" ] || { echo "::error::default columns show [$*], want PHASE=Ready MODEL=placeholder/ci-test"; exit 1; }

      - name: The operator runs the image built here
        # Ready alone proves nothing about this commit: if the load above did
        # not take, the node pulls the published image with the same tag and
        # the example still reaches Ready. The pod's imageID must be the
        # config digest of the image built in this job.
        run: |
          cfg=$(docker save "$IMG" | tar -xO manifest.json | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["Config"])')
          cfg=${cfg##*/}; want="sha256:${cfg%.json}"
          got=$(kubectl get pods -n vllm-system -l app.kubernetes.io/name=vllm-coldstart-operator -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')
          [ "$got" = "$want" ] || { echo "::error::operator runs $got, not the image built here ($want)"; exit 1; }
          echo "operator runs the image built here: $want"
          echo "IMAGE_ID=$want" >> "$GITHUB_ENV"

      - name: The reporter DaemonSet reports as the chart ships it
        # The e2e job runs the reporter as a process with the job's admin
        # kubeconfig, which cannot show that the chart's own pieces work: the
        # reporter's ServiceAccount and Role, the image built above, the node
        # name from the downward API, a signal value through reporter.extraEnv.
        run: |
          /tmp/linux-amd64/helm upgrade vcso chart --namespace vllm-system --reuse-values \
            --set reporter.enabled=true --set reporter.synthetic=true \
            --set-json 'reporter.extraEnv=[{"name":"REPORTER_SYNTHETIC_GPU_UTILIZATION","value":"0.25"}]' \
            --wait --timeout 2m
          # helm --wait returned here with the DaemonSet at 0 of 1 ready and
          # the reporter pod still ContainerCreating, before the pod's status
          # carried an imageID (seen in CI). Wait for the rollout itself.
          kubectl rollout status daemonset/vcso-vllm-coldstart-operator-reporter -n vllm-system --timeout=2m
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          t=""
          for i in $(seq 1 30); do
            t=$(kubectl get nodestate "$NODE" -n vllm-system -o jsonpath='{.status.lastReportTime}' 2>/dev/null || true)
            [ -n "$t" ] && break
            sleep 1
          done
          [ -n "$t" ] || { echo "::error::no report on NodeState $NODE in vllm-system within 30s"; exit 1; }
          u=$(kubectl get nodestate "$NODE" -n vllm-system -o jsonpath='{.status.gpuUtilization}')
          [ "$u" = "0.25" ] || { echo "::error::gpuUtilization is '$u', reporter.extraEnv set 0.25"; exit 1; }
          got=$(kubectl get pods -n vllm-system -l app.kubernetes.io/component=reporter -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')
          [ "$got" = "$IMAGE_ID" ] || { echo "::error::reporter runs $got, not the image built here ($IMAGE_ID)"; exit 1; }
          echo "reporter DaemonSet reported on $NODE at $t (gpuUtilization $u), image $got"

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get all,vllmservice -A || true
          kubectl describe pods -n vllm-system || true
          kubectl logs -n vllm-system -l app.kubernetes.io/name=vllm-coldstart-operator --tail=200 || true
          kubectl get nodestate -A -o yaml || true
          kubectl logs -n vllm-system -l app.kubernetes.io/component=reporter --tail=100 || true

  preemption:
    name: preemption on multi-node kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-preemption-${{ hashFiles('**/Cargo.lock') }}

      - name: Build operator
        run: cargo build --bin vllm-coldstart-operator

      - name: Create kind cluster with two workers
        uses: helm/kind-action@v1
        with:
          cluster_name: preemption
          config: .github/kind/two-workers.yaml

      - name: Wait for every node and install the CRDs
        # The action waits for the control plane only.
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=180s
          kubectl apply -f deploy/crd.yaml
          for crd in vllmservices fleetservices nodestates; do
            kubectl wait --for=condition=Established "crd/$crd.inference.michelecampi.dev" --timeout=30s
          done

      - name: Start operator in background
        run: |
          ./target/debug/vllm-coldstart-operator > operator.log 2>&1 &
          echo $! > operator.pid
          sleep 3
          echo "operator started (pid $(cat operator.pid))"

      - name: Place one replica on the Warm worker
        # The first worker's NodeState is Warm, the second's Cold, so
        # warmth-first placement starts on the first. The child's Deployment
        # must carry the make-before-break strategy the move relies on.
        run: |
          read -r W1 W2 <<< "$(kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{.items[*].metadata.name}')"
          [ -n "$W1" ] && [ -n "$W2" ] || { echo "ERROR: want two workers, got '$W1' '$W2'"; exit 1; }
          echo "W1=$W1" >> "$GITHUB_ENV"
          echo "W2=$W2" >> "$GITHUB_ENV"
          seed() {
            kubectl create -f - <<EOF
          apiVersion: inference.michelecampi.dev/v1alpha1
          kind: NodeState
          metadata:
            name: $1
          spec: {}
          EOF
            kubectl patch nodestate "$1" --subresource=status --type=merge -p "{\"status\":{\"warmth\":\"$2\"}}"
          }
          seed "$W1" Warm
          seed "$W2" Cold
          kubectl apply -f - <<EOF
          apiVersion: inference.michelecampi.dev/v1alpha1
          kind: FleetService
          metadata:
            name: pre-fleet
            namespace: default
          spec:
            model: pre-model
            replicas: 1
            template:
              gpu: 0
              healthPath: ""
              image: registry.k8s.io/pause:3.10
          EOF
          phase=""
          for i in $(seq 1 60); do
            phase=$(kubectl get fleetservice pre-fleet -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$phase" = "Ready" ] && break
            sleep 3
          done
          [ "$phase" = "Ready" ] || { echo "ERROR: pre-fleet phase is '$phase', want Ready"; exit 1; }
          node=$(kubectl get fleetservice pre-fleet -o jsonpath='{.status.placements[0].nodeRef}')
          [ "$node" = "$W1" ] || { echo "ERROR: placed on '$node', want the Warm worker $W1"; exit 1; }
          strategy=$(kubectl get deployment pre-fleet-0 -o jsonpath='{.spec.strategy.rollingUpdate.maxSurge}/{.spec.strategy.rollingUpdate.maxUnavailable}')
          [ "$strategy" = "1/0" ] || { echo "ERROR: child Deployment maxSurge/maxUnavailable is '$strategy', want 1/0"; exit 1; }
          echo "pre-fleet Ready on $W1; child Deployment maxSurge/maxUnavailable $strategy"

      - name: A preemption notice moves the replica to the Cold survivor (ADR-0005, ADR-0011 D2)
        run: |
          kubectl patch nodestate "$W1" --subresource=status --type=merge -p '{"status":{"spot":{"preemptionNoticeDetected":true}}}'
          node=""; phase=""; pods=""
          for i in $(seq 1 60); do
            node=$(kubectl get fleetservice pre-fleet -o jsonpath='{.status.placements[0].nodeRef}')
            phase=$(kubectl get fleetservice pre-fleet -o jsonpath='{.status.phase}')
            pods=$(kubectl get pods -l app=pre-fleet-0 -o jsonpath='{.items[*].spec.nodeName}')
            [ "$node" = "$W2" ] && [ "$phase" = "Ready" ] && [ "$pods" = "$W2" ] && break
            sleep 3
          done
          echo "nodeRef=$node phase=$phase pods on [$pods]"
          [ "$node" = "$W2" ] || { echo "ERROR: slot 0 is on '$node', want the Cold survivor $W2"; exit 1; }
          pin=$(kubectl get vllmservice pre-fleet-0 -o jsonpath='{.spec.nodeName}')
          [ "$pin" = "$W2" ] || { echo "ERROR: child pinned to '$pin', want $W2"; exit 1; }
          [ "$phase" = "Ready" ] || { echo "ERROR: pre-fleet phase is '$phase', want Ready"; exit 1; }
          [ "$pods" = "$W2" ] || { echo "ERROR: child pods on [$pods], want one on $W2"; exit 1; }
          if grep -q "drain-and-hold" operator.log; then
            echo "ERROR: the operator logged a drain-and-hold"; exit 1
          fi
          echo "replica moved from $W1 to the Cold survivor $W2; fleet Ready, one child pod, on $W2"

      - name: A cordon and drain moves the replica off its node (ADR-0017)
        # The notice on W1 is cleared first: with it W1 is no survivor and the
        # right outcome would be a drain-and-hold. The drain is kubectl's own,
        # as an operator would run it for node maintenance.
        run: |
          kubectl patch nodestate "$W1" --subresource=status --type=merge -p '{"status":{"spot":{"preemptionNoticeDetected":false}}}'
          kubectl cordon "$W2"
          kubectl drain "$W2" --ignore-daemonsets --delete-emptydir-data --timeout=120s
          node=""; phase=""; pods=""
          for i in $(seq 1 60); do
            node=$(kubectl get fleetservice pre-fleet -o jsonpath='{.status.placements[0].nodeRef}')
            phase=$(kubectl get fleetservice pre-fleet -o jsonpath='{.status.phase}')
            pods=$(kubectl get pods -l app=pre-fleet-0 -o jsonpath='{.items[*].spec.nodeName}')
            [ "$node" = "$W1" ] && [ "$phase" = "Ready" ] && [ "$pods" = "$W1" ] && break
            sleep 3
          done
          echo "nodeRef=$node phase=$phase pods on [$pods]"
          [ "$node" = "$W1" ] || { echo "ERROR: slot 0 is on '$node', want $W1 after the cordon of $W2"; exit 1; }
          pin=$(kubectl get vllmservice pre-fleet-0 -o jsonpath='{.spec.nodeName}')
          [ "$pin" = "$W1" ] || { echo "ERROR: child pinned to '$pin', want $W1"; exit 1; }
          [ "$phase" = "Ready" ] || { echo "ERROR: pre-fleet phase is '$phase', want Ready"; exit 1; }
          [ "$pods" = "$W1" ] || { echo "ERROR: child pods on [$pods], want one on $W1"; exit 1; }
          grep -q "rescheduling slot 0 to '$W1'" operator.log || { echo "ERROR: no reschedule of slot 0 to $W1 in operator.log"; exit 1; }
          if grep -q "drain-and-hold" operator.log; then
            echo "ERROR: the operator logged a drain-and-hold"; exit 1
          fi
          echo "cordon and drain of $W2 moved the replica to $W1; fleet Ready, one child pod, on $W1"

      - name: A second replica goes to the other node, even a Cold one (ADR-0018)
        # W1 is Warm and holds slot 0. Before ADR-0018 warmth ranked first, so
        # slot 1 joined slot 0 on W1 and one node failure took the whole fleet.
        run: |
          kubectl uncordon "$W2"
          kubectl patch nodestate "$W1" --subresource=status --type=merge -p '{"status":{"warmth":"Warm"}}'
          kubectl patch nodestate "$W2" --subresource=status --type=merge -p '{"status":{"warmth":"Cold"}}'
          kubectl patch fleetservice pre-fleet --type=merge -p '{"spec":{"replicas":2}}'
          node=""; phase=""; p0=""; p1=""
          for i in $(seq 1 60); do
            node=$(kubectl get fleetservice pre-fleet -o jsonpath='{.status.placements[1].nodeRef}')
            phase=$(kubectl get fleetservice pre-fleet -o jsonpath='{.status.phase}')
            p0=$(kubectl get pods -l app=pre-fleet-0 -o jsonpath='{.items[*].spec.nodeName}')
            p1=$(kubectl get pods -l app=pre-fleet-1 -o jsonpath='{.items[*].spec.nodeName}')
            [ "$node" = "$W2" ] && [ "$phase" = "Ready" ] && [ "$p0" = "$W1" ] && [ "$p1" = "$W2" ] && break
            sleep 3
          done
          echo "slot 1 nodeRef=$node phase=$phase pods slot 0 on [$p0], slot 1 on [$p1]"
          [ "$node" = "$W2" ] || { echo "ERROR: slot 1 is on '$node', want $W2 (Cold, no replica of the fleet)"; exit 1; }
          pin=$(kubectl get vllmservice pre-fleet-1 -o jsonpath='{.spec.nodeName}')
          [ "$pin" = "$W2" ] || { echo "ERROR: slot 1 child pinned to '$pin', want $W2"; exit 1; }
          [ "$phase" = "Ready" ] || { echo "ERROR: pre-fleet phase is '$phase', want Ready"; exit 1; }
          [ "$p0" = "$W1" ] && [ "$p1" = "$W2" ] || { echo "ERROR: pods on [$p0] and [$p1], want one on $W1 and one on $W2"; exit 1; }
          echo "two replicas on two nodes: slot 0 on $W1 (Warm), slot 1 on $W2 (Cold)"

      - name: Dump state on failure
        if: failure()
        run: |
          cat operator.log || true
          kubectl get fleetservice -o yaml || true
          kubectl get nodestate -A -o yaml || true
          kubectl get pods -A -o wide || true

      - name: Stop operator
        if: always()
        run: kill "$(cat operator.pid)" 2>/dev/null || true

  sim-load:
    name: load through the llm-d simulator on kind
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build operator
        run: cargo build --bins

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: sim-load

      - name: Build and load the simulator image
        # The operator's gpu=0 path injects no command or args, so the image
        # configures itself (hack/rehearsal/Dockerfile.sim).
        run: |
          docker build -t llmd-sim-rehearsal:v0.8.2 -f hack/rehearsal/Dockerfile.sim hack/rehearsal
          kind load docker-image llmd-sim-rehearsal:v0.8.2 --name sim-load

      - name: Install CRD
        run: |
          kubectl apply -f deploy/crd.yaml
          kubectl wait --for=condition=Established crd/vllmservices.inference.michelecampi.dev --timeout=30s

      - name: Start operator in background
        run: |
          ./target/debug/vllm-coldstart-operator > operator.log 2>&1 &
          echo $! > operator.pid
          sleep 3
          echo "operator started (pid $(cat operator.pid))"

      - name: Serve one replica from the simulator
        # healthPath makes Ready mean the simulator answers, unlike the pause
        # placeholder of the other jobs (healthPath "").
        run: |
          kubectl apply -f - <<EOF
          apiVersion: inference.michelecampi.dev/v1alpha1
          kind: VllmService
          metadata:
            name: sim-load
            namespace: default
          spec:
            model: facebook/opt-125m
            replicas: 1
            warmupStrategy: Eager
            image: "llmd-sim-rehearsal:v0.8.2"
            gpu: 0
            healthPath: /health
          EOF
          kubectl wait --for=jsonpath='{.status.phase}'=Ready vllmservice/sim-load --timeout=180s

      - name: Reach the operator's Service
        run: |
          python3 -m venv /tmp/loadgen && /tmp/loadgen/bin/pip install --quiet aiohttp==3.14.1
          kubectl port-forward svc/sim-load 8001:8000 > port-forward.log 2>&1 &
          echo $! > port-forward.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8001/health > /dev/null

      - name: Within capacity, the objectives hold
        # keep 0.025 is the load at which every objective was met with no
        # error budget consumed; capacity, seeds and limits in ADR-0013.
        run: |
          curl -sf http://127.0.0.1:8001/metrics > within.before
          /tmp/loadgen/bin/python hack/loadgen/loadgen.py --target sim=http://127.0.0.1:8001 \
            --model facebook/opt-125m --profile hack/loadgen/profiles/azure-conv-2023-peak.csv --keep 0.025 --seed 42 \
            --out within.jsonl
          curl -sf http://127.0.0.1:8001/metrics > within.after
          python3 hack/loadgen/slo_check.py within.jsonl within.before within.after --slo hack/loadgen/slo.json \
            --sequence 398f3b6c143c24de879de3c9d95f6d5c2f32005661956b6986fc61df9812abfc --assert-slo

      - name: Overloaded, every request is still served
        # keep 0.1 has up to 13 requests in flight for 5 slots: the
        # objectives are reported, and missed; correctness is still asserted.
        run: |
          curl -sf http://127.0.0.1:8001/metrics > overload.before
          /tmp/loadgen/bin/python hack/loadgen/loadgen.py --target sim=http://127.0.0.1:8001 \
            --model facebook/opt-125m --profile hack/loadgen/profiles/azure-conv-2023-peak.csv --keep 0.1 --seed 42 \
            --out overload.jsonl
          curl -sf http://127.0.0.1:8001/metrics > overload.after
          python3 hack/loadgen/slo_check.py overload.jsonl overload.before overload.after --slo hack/loadgen/slo.json \
            --sequence b170da22aa6101c6c20fbbaa9c9d2b647006161e2dffc7bf8710ec8135acdf62

      - name: Dump cluster and operator state on failure
        # On 546fe53 (run 39666087210, first attempt) the Ready wait timed
        # out and operator.log held one reconcile that never finished: the
        # client's read timeout is 295 s, longer than the wait. Record what
        # the API server, the resources and the operator saw. Every call is
        # bounded, since the API server may be what does not answer.
        if: failure()
        timeout-minutes: 3
        run: |
          k="kubectl --request-timeout=20s"
          $k get --raw '/readyz?verbose' || true
          $k get vllmservice,deployment,service,pods -o wide || true
          $k describe vllmservice sim-load || true
          $k describe deployment sim-load || true
          $k describe pods || true
          $k get events -A --sort-by=.lastTimestamp || true
          curl -s --max-time 5 http://127.0.0.1:8080/metrics | grep '^vcso_' || true

      - name: Upload load record and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-load
          path: |
            within.*
            overload.*
            operator.log
            port-forward.log
          if-no-files-found: ignore

      - name: Stop port-forward and operator
        if: always()
        run: |
          kill "$(cat port-forward.pid)" 2>/dev/null || true
          kill "$(cat operator.pid)" 2>/dev/null || true

  manifests:
    name: examples and README against the CRDs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the manifests with kubeconform
        run: bash hack/validate-manifests.sh

  keda:
    name: KEDA scales a fleet to zero and back on kind
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build operator and reporter
        run: cargo build --bins

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: keda

      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/helm.tgz "$HELM_URL"
          echo "$HELM_SHA256  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm

      - name: Install KEDA, chart and images pinned
        run: bash hack/keda-install.sh

      - name: Install CRD
        run: |
          kubectl apply -f deploy/crd.yaml
          kubectl wait --for=condition=Established crd --all --timeout=30s

      - name: Start operator and reporter
        # Without a NodeState the fleet has no candidate (see the e2e job).
        run: |
          ./target/debug/vllm-coldstart-operator > operator.log 2>&1 &
          echo $! > operator.pid
          sleep 3
          echo "operator started (pid $(cat operator.pid))"
          bash hack/e2e-reporter.sh start

      - name: The fleet is Ready with one replica
        run: |
          kubectl apply -f deploy/examples/ci-fleet.yaml
          ready=""
          for i in $(seq 1 40); do
            ready=$(kubectl get fleetservice ci-fleet -o jsonpath='{.status.phase}/{.status.readyReplicas}' 2>/dev/null || true)
            [ "$ready" = "Ready/1" ] && break
            sleep 3
          done
          [ "$ready" = "Ready/1" ] || { echo "ERROR: ci-fleet is '$ready', want Ready/1"; cat operator.log; exit 1; }

      - name: An idle queue drains the fleet to zero
        # The stub serves {"waiting": 0}. After its cooldown KEDA writes
        # spec.replicas 0 through the scale subresource, and the fleet
        # controller deletes the child.
        run: |
          kubectl apply -f deploy/examples/keda/queue-stub.yaml
          kubectl rollout status deployment/queue-stub --timeout=2m
          kubectl apply -f deploy/examples/keda/scaledobject-scale-to-zero.yaml
          r=""; child=""
          for i in $(seq 1 40); do
            r=$(kubectl get fleetservice ci-fleet -o jsonpath='{.spec.replicas}')
            child=$(kubectl get vllmservice ci-fleet-0 -o name 2>/dev/null || true)
            [ "$r" = "0" ] && [ -z "$child" ] && break
            sleep 3
          done
          [ "$r" = "0" ] || { echo "ERROR: ci-fleet spec.replicas is '$r', want 0"; exit 1; }
          [ -z "$child" ] || { echo "ERROR: $child still exists with spec.replicas 0"; exit 1; }
          echo "idle queue: spec.replicas 0 and no child after about $((i*3))s"

      - name: A waiting request brings the fleet back to one
        run: |
          kubectl create configmap queue-stub-cfg --from-literal=queue.json='{"waiting": 4}' --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout restart deployment/queue-stub
          kubectl rollout status deployment/queue-stub --timeout=2m
          r=""; ready=""
          for i in $(seq 1 40); do
            r=$(kubectl get fleetservice ci-fleet -o jsonpath='{.spec.replicas}')
            ready=$(kubectl get fleetservice ci-fleet -o jsonpath='{.status.phase}/{.status.readyReplicas}')
            [ "$r" = "1" ] && [ "$ready" = "Ready/1" ] && break
            sleep 3
          done
          [ "$r" = "1" ] || { echo "ERROR: ci-fleet spec.replicas is '$r', want 1"; exit 1; }
          [ "$ready" = "Ready/1" ] || { echo "ERROR: ci-fleet is '$ready', want Ready/1"; exit 1; }
          echo "waiting 4: spec.replicas 1 and the fleet Ready after about $((i*3))s"

      - name: Dump state on failure
        if: failure()
        run: |
          cat operator.log || true
          cat reporter.log || true
          kubectl get scaledobject,hpa -A -o yaml || true
          kubectl get fleetservice,vllmservice -o yaml || true
          kubectl get pods -A -o wide || true
          kubectl logs -n keda deployment/keda-operator --tail=200 || true

      - name: Stop reporter and operator
        if: always()
        run: |
          bash hack/e2e-reporter.sh stop || true
          kill "$(cat operator.pid)" 2>/dev/null || true

  scale-out:
    name: KEDA scales a fleet 1 to N under load on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build operator and reporter
        run: cargo build --bins

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: scale-out

      - name: Build and load the simulator image
        run: |
          docker build -t llmd-sim-rehearsal:v0.8.2 -f hack/rehearsal/Dockerfile.sim hack/rehearsal
          kind load docker-image llmd-sim-rehearsal:v0.8.2 --name scale-out

      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/helm.tgz "$HELM_URL"
          echo "$HELM_SHA256  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm

      - name: Install KEDA, chart and images pinned
        run: bash hack/keda-install.sh

      - name: Install Prometheus, image pinned
        # The manifest is the one place the image is pinned; the pod must
        # run exactly that reference.
        run: |
          kubectl apply -f hack/scale-out/prometheus.yaml
          kubectl rollout status deployment/prometheus -n monitoring --timeout=2m
          want=$(grep -o -E 'mirror\.gcr\.io/prom/prometheus:[^ ]+' hack/scale-out/prometheus.yaml)
          got=$(kubectl get pods -n monitoring -l app=prometheus -o jsonpath='{.items[*].spec.containers[0].image}')
          [ "$got" = "$want" ] || { echo "::error::Prometheus runs [$got], want [$want]"; exit 1; }
          echo "Prometheus runs the pinned image: $got"

      - name: Install CRD
        run: |
          kubectl apply -f deploy/crd.yaml
          kubectl wait --for=condition=Established crd --all --timeout=30s

      - name: Start operator and reporter
        # Without a NodeState the fleet has no candidate (see the e2e job).
        run: |
          ./target/debug/vllm-coldstart-operator > operator.log 2>&1 &
          echo $! > operator.pid
          sleep 3
          echo "operator started (pid $(cat operator.pid))"
          bash hack/e2e-reporter.sh start

      - name: The fleet serves one replica through its NodePort
        # The runner reaches the kind node's IP directly; kube-proxy then
        # balances each connection over the fleet's Ready pods.
        run: |
          kubectl apply -f hack/scale-out/sim-fleet.yaml
          ready=""
          for i in $(seq 1 60); do
            ready=$(kubectl get fleetservice sim-fleet -o jsonpath='{.status.phase}/{.status.readyReplicas}' 2>/dev/null || true)
            [ "$ready" = "Ready/1" ] && break
            sleep 3
          done
          [ "$ready" = "Ready/1" ] || { echo "ERROR: sim-fleet is '$ready', want Ready/1"; cat operator.log; exit 1; }
          node_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' scale-out-control-plane)
          for i in $(seq 1 30); do curl -sf "http://$node_ip:30080/health" > /dev/null && break; sleep 1; done
          curl -sf "http://$node_ip:30080/health" > /dev/null
          echo "FLEET_URL=http://$node_ip:30080" >> "$GITHUB_ENV"
          echo "fleet Ready/1, serving at http://$node_ip:30080"

      - name: Prometheus scrapes the fleet's pod
        run: |
          up=""
          for i in $(seq 1 40); do
            up=$(kubectl get --raw '/api/v1/namespaces/monitoring/services/prometheus:9090/proxy/api/v1/query?query=up' | python3 -c 'import json, sys; print(" ".join(r["metric"].get("fleet", "") + "=" + r["value"][1] for r in json.load(sys.stdin)["data"]["result"]))' || true)
            [ "$up" = "sim-fleet=1" ] && break
            sleep 3
          done
          [ "$up" = "sim-fleet=1" ] || { echo "ERROR: Prometheus targets are '$up', want sim-fleet=1"; exit 1; }
          echo "Prometheus scrapes the fleet: $up"

      - name: The HPA accepts the fleet as a scale target
        # Before ADR-0014 this HPA reported ScalingActive=False with
        # InvalidSelector: the fleet's scale subresource had no selector.
        run: |
          kubectl apply -f deploy/examples/keda/scaledobject-scale-out.yaml
          active=""
          for i in $(seq 1 40); do
            active=$(kubectl get hpa keda-hpa-sim-fleet-scale-out -o jsonpath='{.status.conditions[?(@.type=="ScalingActive")].status}' 2>/dev/null || true)
            [ "$active" = "True" ] && break
            sleep 3
          done
          [ "$active" = "True" ] || { echo "ERROR: ScalingActive is '$active', want True"; kubectl describe hpa; exit 1; }
          kubectl get hpa keda-hpa-sim-fleet-scale-out

      - name: Under load the fleet scales out, within its cap
        # keep 0.1 overloads one replica (the sim-load job); what is asserted
        # and what is only reported is in ADR-0014.
        run: |
          python3 -m venv /tmp/loadgen && /tmp/loadgen/bin/pip install --quiet aiohttp==3.14.1
          bash hack/scale-out/measure.sh

      - name: Upload load record and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-out
          path: |
            scale-out.*
            operator.log
            reporter.log
          if-no-files-found: ignore

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get scaledobject,hpa -A -o yaml || true
          kubectl get fleetservice,vllmservice -o yaml || true
          kubectl get pods -A -o wide || true
          kubectl logs -n keda deployment/keda-operator --tail=200 || true
          kubectl logs -n monitoring deployment/prometheus --tail=100 || true

      - name: Stop reporter and operator
        if: always()
        run: |
          bash hack/e2e-reporter.sh stop || true
          kill "$(cat operator.pid)" 2>/dev/null || true

  scale-from-zero:
    name: KEDA wakes a fleet from zero through the HTTP add-on on kind
    # The scale-out job's bench (same simulator, KEDA, Prometheus and load),
    # repeated rather than shared, with the fleet starting at zero replicas
    # and the load entering through the add-on's interceptor (ADR-0015).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build operator and reporter
        run: cargo build --bins

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: scale-from-zero

      - name: Build and load the simulator image
        run: |
          docker build -t llmd-sim-rehearsal:v0.8.2 -f hack/rehearsal/Dockerfile.sim hack/rehearsal
          kind load docker-image llmd-sim-rehearsal:v0.8.2 --name scale-from-zero

      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/helm.tgz "$HELM_URL"
          echo "$HELM_SHA256  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm

      - name: Install KEDA, chart and images pinned
        run: bash hack/keda-install.sh

      - name: Install the KEDA HTTP add-on, chart and images pinned
        run: bash hack/keda-http-install.sh

      - name: Install Prometheus, image pinned
        # The manifest is the one place the image is pinned; the pod must
        # run exactly that reference.
        run: |
          kubectl apply -f hack/scale-out/prometheus.yaml
          kubectl rollout status deployment/prometheus -n monitoring --timeout=2m
          want=$(grep -o -E 'mirror\.gcr\.io/prom/prometheus:[^ ]+' hack/scale-out/prometheus.yaml)
          got=$(kubectl get pods -n monitoring -l app=prometheus -o jsonpath='{.items[*].spec.containers[0].image}')
          [ "$got" = "$want" ] || { echo "::error::Prometheus runs [$got], want [$want]"; exit 1; }
          echo "Prometheus runs the pinned image: $got"

      - name: Install CRD
        run: |
          kubectl apply -f deploy/crd.yaml
          kubectl wait --for=condition=Established crd --all --timeout=30s

      - name: Start operator and reporter
        # Without a NodeState the fleet has no candidate (see the e2e job).
        run: |
          ./target/debug/vllm-coldstart-operator > operator.log 2>&1 &
          echo $! > operator.pid
          sleep 3
          echo "operator started (pid $(cat operator.pid))"
          bash hack/e2e-reporter.sh start

      - name: The fleet serves one replica through the interceptor
        # A /health that succeeds on port 30081 has crossed the interceptor
        # and the route to the fleet: the path the load will take.
        run: |
          kubectl apply -f hack/scale-out/sim-fleet.yaml
          ready=""
          for i in $(seq 1 60); do
            ready=$(kubectl get fleetservice sim-fleet -o jsonpath='{.status.phase}/{.status.readyReplicas}' 2>/dev/null || true)
            [ "$ready" = "Ready/1" ] && break
            sleep 3
          done
          [ "$ready" = "Ready/1" ] || { echo "ERROR: sim-fleet is '$ready', want Ready/1"; cat operator.log; exit 1; }
          kubectl apply -f hack/scale-from-zero/interceptor-nodeport.yaml -f deploy/examples/keda/scale-from-zero.yaml
          node_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' scale-from-zero-control-plane)
          for i in $(seq 1 30); do curl -sf "http://$node_ip:30081/health" > /dev/null && break; sleep 1; done
          curl -sf "http://$node_ip:30081/health" > /dev/null
          echo "FLEET_URL=http://$node_ip:30081" >> "$GITHUB_ENV"
          echo "fleet Ready/1, serving through the interceptor at http://$node_ip:30081"

      - name: Prometheus scrapes the fleet's pod
        run: |
          up=""
          for i in $(seq 1 40); do
            up=$(kubectl get --raw '/api/v1/namespaces/monitoring/services/prometheus:9090/proxy/api/v1/query?query=up' | python3 -c 'import json, sys; print(" ".join(r["metric"].get("fleet", "") + "=" + r["value"][1] for r in json.load(sys.stdin)["data"]["result"]))' || true)
            [ "$up" = "sim-fleet=1" ] && break
            sleep 3
          done
          [ "$up" = "sim-fleet=1" ] || { echo "ERROR: Prometheus targets are '$up', want sim-fleet=1"; exit 1; }
          echo "Prometheus scrapes the fleet: $up"

      - name: The HPA accepts the fleet as a scale target
        # AbleToScale, not ScalingActive: KEDA may take the idle fleet to
        # zero as soon as the ScaledObject exists, since one never active
        # has no initial cooldown (ADR-0015, fact 4), and at zero the HPA
        # reports ScalingActive=False. The scale-out later in this job
        # shows that the HPA reads its metrics.
        run: |
          active=""
          for i in $(seq 1 40); do
            active=$(kubectl get hpa keda-hpa-sim-fleet-scale-from-zero -o jsonpath='{.status.conditions[?(@.type=="AbleToScale")].status}' 2>/dev/null || true)
            [ "$active" = "True" ] && break
            sleep 3
          done
          [ "$active" = "True" ] || { echo "ERROR: AbleToScale is '$active', want True"; kubectl describe hpa; exit 1; }
          kubectl get hpa keda-hpa-sim-fleet-scale-from-zero

      - name: The fleet goes to zero replicas
        # KEDA may already have taken the idle fleet there (see the step
        # above); setting it here starts the load from zero either way.
        run: |
          kubectl patch fleetservice sim-fleet --type merge -p '{"spec":{"replicas":0}}'
          state=""
          for i in $(seq 1 60); do
            state="$(kubectl get fleetservice sim-fleet -o jsonpath='{.spec.replicas}/{.status.readyReplicas}')/$(kubectl get pods -l inference.michelecampi.dev/fleet=sim-fleet -o name | wc -l)"
            [ "$state" = "0/0/0" ] && break
            sleep 2
          done
          [ "$state" = "0/0/0" ] || { echo "ERROR: sim-fleet spec/ready/pods is '$state', want 0/0/0"; exit 1; }
          echo "sim-fleet at zero: spec/ready/pods $state"

      - name: Under load the fleet wakes from zero and scales out
        # measure.sh asserts the scale-out of ADR-0014, coldstart.py the
        # wake of ADR-0015; both run, so a failure keeps both reports.
        env:
          OUT: scale-from-zero
          HPA: keda-hpa-sim-fleet-scale-from-zero
          FROM_ZERO: "1"
        run: |
          python3 -m venv /tmp/loadgen && /tmp/loadgen/bin/pip install --quiet aiohttp==3.14.1
          status=0
          bash hack/scale-out/measure.sh || status=1
          python3 hack/scale-from-zero/coldstart.py scale-from-zero.jsonl scale-from-zero.replicas || status=1
          exit "$status"

      - name: Without load the fleet returns to zero after its cooldown
        # KEDA takes the fleet to zero cooldownPeriod after the last moment a
        # trigger was active (ADR-0015); idle.py checks when, and counts the
        # replica-seconds the fleet stays up with nothing to serve.
        run: |
          for i in $(seq 1 120); do
            s="$(date +%s) $(kubectl get fleetservice sim-fleet -o jsonpath='{.spec.replicas} {.status.readyReplicas}') $(kubectl get pods -l inference.michelecampi.dev/fleet=sim-fleet -o name | wc -l)"
            echo "$s" >> scale-from-zero.idle
            set -- $s
            [ "$2/$4" = "0/0" ] && break
            sleep 5
          done
          python3 hack/scale-from-zero/idle.py scale-from-zero.jsonl scale-from-zero.idle

      - name: Upload load record and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-from-zero
          path: |
            scale-from-zero.*
            operator.log
            reporter.log
          if-no-files-found: ignore

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get scaledobject,hpa,interceptorroute -A -o yaml || true
          kubectl get fleetservice,vllmservice -o yaml || true
          kubectl get pods -A -o wide || true
          kubectl logs -n keda deployment/keda-operator --tail=200 || true
          kubectl logs -n keda -l app.kubernetes.io/component=interceptor,app.kubernetes.io/instance=keda-add-ons-http --prefix --tail=100 || true
          kubectl logs -n keda -l app.kubernetes.io/component=scaler,app.kubernetes.io/instance=keda-add-ons-http --prefix --tail=100 || true
          kubectl logs -n monitoring deployment/prometheus --tail=100 || true

      - name: Stop reporter and operator
        if: always()
        run: |
          bash hack/e2e-reporter.sh stop || true
          kill "$(cat operator.pid)" 2>/dev/null || true
