name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

  e2e:
    name: end-to-end on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build operator and crdgen
        run: cargo build --bins

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: e2e

      - name: Install CRD
        run: |
          cargo run --bin crdgen > deploy/crd.yaml
          kubectl apply -f deploy/crd.yaml
          kubectl wait --for=condition=Established crd/vllmservices.inference.michelecampi.dev --timeout=30s

      - name: Start operator in background
        run: |
          ./target/debug/vllm-coldstart-operator > operator.log 2>&1 &
          echo $! > operator.pid
          sleep 3
          echo "operator started (pid $(cat operator.pid))"

      - name: Apply a VllmService
        run: kubectl apply -f deploy/examples/ci-placeholder.yaml

      - name: Wait for Deployment to be created
        run: |
          for i in $(seq 1 30); do
            if kubectl get deployment ci-placeholder >/dev/null 2>&1; then
              echo "Deployment created after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Deployment not created within 30s"
          kubectl get all
          cat operator.log
          exit 1

      - name: Wait for status to reach Ready
        run: |
          for i in $(seq 1 60); do
            phase=$(kubectl get vllmservice ci-placeholder -o jsonpath='{.status.phase}' 2>/dev/null || true)
            echo "[$i] phase=${phase:-<none>}"
            if [ "$phase" = "Ready" ]; then
              echo "VllmService reached Ready after ${i}s"
              kubectl get vllmservice ci-placeholder -o jsonpath='{.status.message}'
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: VllmService did not reach Ready within 120s"
          kubectl get vllmservice ci-placeholder -o yaml
          cat operator.log
          exit 1

      - name: Verify owner reference and garbage collection
        run: |
          owner=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.ownerReferences[0].kind}')
          [ "$owner" = "VllmService" ] || { echo "ERROR: bad owner ref: $owner"; exit 1; }
          kubectl delete vllmservice ci-placeholder
          for i in $(seq 1 30); do
            if ! kubectl get deployment ci-placeholder >/dev/null 2>&1; then
              echo "Deployment garbage-collected after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Deployment not garbage-collected within 30s"
          exit 1

      - name: Seed a NodeState for the fleet planner
        run: |
          # The per-node reporter does not run in CI, and without a NodeState
          # carrying a status the fleet controller logs "no reported NodeState
          # objects, nothing to place" and places nothing — a fleet e2e without
          # this asserts on a system that was never asked to do anything.
          #
          # The name must be the real node's: the child VllmService is pinned
          # with a kubernetes.io/hostname nodeSelector (ADR-0004), so a fixed
          # name in a manifest schedules nothing the moment the cluster is
          # named differently. Rehearsed locally on 2026-08-06, where exactly
          # that produced FailedScheduling for 90s.
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          echo "seeding NodeState for node: $NODE"
          kubectl create -f - <<EOF
          apiVersion: inference.michelecampi.dev/v1alpha1
          kind: NodeState
          metadata:
            name: $NODE
          spec: {}
          EOF
          # status is a subresource: an apply carrying it drops it silently.
          # Only `warmth` matters here — node_state_to_candidate requires the
          # status to exist and treats every signal inside as Option.
          kubectl patch nodestate "$NODE" --subresource=status --type=merge \
            -p '{"status":{"warmth":"Warm"}}'
      - name: Apply a FleetService and wait for Ready
        run: |
          kubectl apply -f deploy/examples/ci-fleet.yaml
          for i in $(seq 1 40); do
            phase=$(kubectl get fleetservice ci-fleet -o jsonpath='{.status.phase}' 2>/dev/null || true)
            ready=$(kubectl get fleetservice ci-fleet -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
            echo "[$i] phase=${phase:-<none>} ready=${ready:-<none>}"
            if [ "$phase" = "Ready" ] && [ "$ready" = "1" ]; then
              echo "FleetService reached Ready after ~$((i*3))s"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: FleetService did not reach Ready within 120s"
          kubectl get fleetservice ci-fleet -o yaml
          kubectl get vllmservice -o yaml
          kubectl describe pods
          cat operator.log
          exit 1
      - name: Verify the child is owned and pinned
        run: |
          # Two properties the VllmService e2e cannot reach: the fleet owns
          # its children (so deleting a fleet does not orphan capacity), and
          # the planner's choice actually reaches the pod spec. A placement
          # that plans correctly but does not pin schedules anywhere, which
          # is the failure the 3xA10 item-4 rehearsal was built to catch.
          NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          owner=$(kubectl get vllmservice ci-fleet-0 -o jsonpath='{.metadata.ownerReferences[0].kind}')
          [ "$owner" = "FleetService" ] || { echo "ERROR: bad owner ref: $owner"; exit 1; }
          pin=$(kubectl get vllmservice ci-fleet-0 -o jsonpath='{.spec.nodeName}')
          [ "$pin" = "$NODE" ] || { echo "ERROR: child pinned to '$pin', node is '$NODE'"; exit 1; }
          echo "child owned by FleetService and pinned to $pin"
      - name: Verify the scale subresource
        run: |
          # ADR-0009 puts replicas on the scale subresource so an external
          # autoscaler can drive the fleet. Nothing tested that path before.
          kubectl scale fleetservice ci-fleet --replicas=2
          for i in $(seq 1 20); do
            n=$(kubectl get fleetservice ci-fleet -o jsonpath='{.status.replicas}' 2>/dev/null || true)
            echo "[$i] status.replicas=${n:-<none>}"
            if [ "$n" = "2" ]; then echo "scale reflected after ~$((i*2))s"; exit 0; fi
            sleep 2
          done
          echo "ERROR: scale to 2 not reflected in status.replicas within 40s"
          kubectl get fleetservice ci-fleet -o yaml
          cat operator.log
          exit 1
      - name: Verify fleet garbage collection
        run: |
          kubectl delete fleetservice ci-fleet
          for i in $(seq 1 30); do
            n=$(kubectl get vllmservice --no-headers 2>/dev/null | wc -l)
            if [ "$n" = "0" ]; then echo "children garbage-collected after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "ERROR: fleet children not garbage-collected within 30s"
          kubectl get vllmservice -o yaml
          exit 1
      - name: Restart the operator over live children
        run: |
          # ADR-0008 lists "no upgrade path exercised" among the non-goals.
          # The property an operator has to have and nobody had checked here:
          # a new process picks up existing children instead of recreating
          # them. Reconcile applies server-side onto deterministic names with
          # an owner reference derived from the CR (src/main.rs), so adoption
          # should be transparent — "should" being exactly what makes it worth
          # a test. Recreation would mean every operator upgrade cycles every
          # replica in the fleet, which is the difference between a rolling
          # upgrade and an outage.
          kubectl apply -f deploy/examples/ci-placeholder.yaml
          for i in $(seq 1 30); do
            kubectl get deployment ci-placeholder >/dev/null 2>&1 && break
            sleep 1
          done
          UID_BEFORE=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.uid}')
          GEN_BEFORE=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.generation}')
          echo "before restart: uid=$UID_BEFORE generation=$GEN_BEFORE"

          kill "$(cat operator.pid)"
          sleep 3
          ./target/debug/vllm-coldstart-operator > operator-restarted.log 2>&1 &
          echo $! > operator.pid
          sleep 10

          UID_AFTER=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.uid}')
          GEN_AFTER=$(kubectl get deployment ci-placeholder -o jsonpath='{.metadata.generation}')
          echo "after restart:  uid=$UID_AFTER generation=$GEN_AFTER"

          [ "$UID_BEFORE" = "$UID_AFTER" ] || {
            echo "ERROR: Deployment was recreated across the restart"
            echo "       (uid $UID_BEFORE -> $UID_AFTER). Every operator"
            echo "       upgrade would cycle every replica."
            cat operator-restarted.log
            exit 1
          }
          # Generation bumps only on a spec change. A restart that rewrites
          # the spec identically must not bump it: if it does, the apply is
          # not idempotent and every restart is a rollout.
          [ "$GEN_BEFORE" = "$GEN_AFTER" ] || {
            echo "ERROR: generation moved $GEN_BEFORE -> $GEN_AFTER on a"
            echo "       restart with no spec change — the apply is not"
            echo "       idempotent and each restart triggers a rollout."
            kubectl get deployment ci-placeholder -o yaml
            cat operator-restarted.log
            exit 1
          }
          echo "operator restart adopted the child without recreating it"
      - name: Pin the selector immutability constraint
        run: |
          # ADR-0008 fact 3: build_deployment feeds one `labels` map to the
          # pod template, the LabelSelector and the Deployment metadata
          # (src/main.rs, three clones of the same BTreeMap). A Deployment's
          # selector is immutable after creation, so any future version that
          # adds a key to that map — fleet membership being the obvious
          # candidate, which fact 2 says is missing — breaks apply on every
          # Deployment that already exists.
          #
          # This step does not test the operator. It pins the constraint the
          # operator has to evolve within, by proving the API server rejects
          # exactly the change a careless version would make. A note in an ADR
          # asks to be remembered; a failing apply asks nothing.
          set +e
          out=$(kubectl patch deployment ci-placeholder --type=merge \
            -p '{"spec":{"selector":{"matchLabels":{"app":"ci-placeholder","inference.michelecampi.dev/fleet":"x"}}}}' 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ $rc -ne 0 ] || {
            echo "ERROR: the API server accepted a selector change."
            echo "       Either this cluster does not enforce selector"
            echo "       immutability, or the patch did not reach the field —"
            echo "       both make this step meaningless and it must be fixed"
            echo "       rather than left passing."
            exit 1
          }
          echo "$out" | grep -qi 'immutable\|invalid' || {
            echo "ERROR: apply failed for some reason other than immutability"
            exit 1
          }
          echo "selector immutability confirmed: adding a label to the shared"
          echo "map is a breaking change for existing Deployments, and any"
          echo "version that needs one has to migrate rather than apply"
      - name: Stop operator
        if: always()
        run: kill "$(cat operator.pid)" 2>/dev/null || true
