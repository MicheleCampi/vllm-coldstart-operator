name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # SLSA Build L2: actions/attest-build-provenance signs the provenance with a
  # short-lived Sigstore certificate (OIDC) and records it in the repository's
  # attestations; verify with gh attestation verify on the image digest.
  id-token: write
  attestations: write

jobs:
  image:
    name: build + push (ghcr)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the declared release
        # On a release tag, the tag, Cargo.toml and the chart's version and
        # appVersion must name the same release before an image is published
        # under that tag. ci.yml does not run on tags, so the check lives here.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          chart_v=$(sed -n 's/^version: //p' chart/Chart.yaml)
          app_v=$(sed -n 's/^appVersion: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' chart/Chart.yaml)
          want="v$cargo_v"
          bad=0
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME differs from Cargo.toml version $cargo_v"; bad=1; }
          [ "v$chart_v" = "$want" ] || { echo "::error::chart version $chart_v differs from Cargo.toml $cargo_v"; bad=1; }
          [ "v$app_v" = "$want" ] || { echo "::error::chart appVersion $app_v differs from Cargo.toml $cargo_v"; bad=1; }
          [ "$bad" = 0 ] && echo "tag $GITHUB_REF_NAME matches Cargo.toml and the chart"
          exit $bad

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The BuildKit image otherwise comes from Docker Hub (moby/buildkit).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Login only when we intend to push (not on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # OCI names must be lowercase; github.repository keeps the owner's case.
      - name: Image name
        id: image
        if: github.event_name != 'pull_request'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA Build L2)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
