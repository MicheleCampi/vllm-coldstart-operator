name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build + push (ghcr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the declared release
        # On a release tag, the tag, Cargo.toml and the chart's version and
        # appVersion must name the same release before an image is published
        # under that tag. ci.yml does not run on tags, so the check lives here.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          chart_v=$(sed -n 's/^version: //p' chart/Chart.yaml)
          app_v=$(sed -n 's/^appVersion: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' chart/Chart.yaml)
          want="v$cargo_v"
          bad=0
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME differs from Cargo.toml version $cargo_v"; bad=1; }
          [ "v$chart_v" = "$want" ] || { echo "::error::chart version $chart_v differs from Cargo.toml $cargo_v"; bad=1; }
          [ "v$app_v" = "$want" ] || { echo "::error::chart appVersion $app_v differs from Cargo.toml $cargo_v"; bad=1; }
          [ "$bad" = 0 ] && echo "tag $GITHUB_REF_NAME matches Cargo.toml and the chart"
          exit $bad

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The BuildKit image otherwise comes from Docker Hub (moby/buildkit).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Login only when we intend to push (not on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
