# Study, not a gate. Hypothesis after A-024: vLLM CPU v0.20.0 forces the mp
# executor (vllm #36487), so the scheduler process and the worker share the
# only physical core of an m7i-flex.large, and the worker slows down. This
# measures v0.19.1 and v0.20.0 at steady state with one physical core (cpu0
# and its SMT sibling) and with every runner CPU (2 cores on a 4-vCPU runner).
# If the hypothesis holds, the v0.20.0 / v0.19.1 gap is larger with one core.
# Free (GitHub runner); CPU model is printed, the step summary has the table.
name: a024-cores-study

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-t7cl72]
    paths:
      - .github/workflows/a024-cores-study.yml
      - hack/steady-study/study.sh

permissions:
  contents: read

jobs:
  study:
    name: ${{ matrix.cpus }} ${{ matrix.reserved }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cpus: all, reserved: "reserved0"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the model
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/hf-cache
          key: hf-qwen2.5-0.5b-instruct-7ae557604adf67be50417f59c2c2f167def9a775
      - name: v0.19.1 and v0.20.0, 2 runs each, interleaved
        env:
          MODEL: Qwen/Qwen2.5-0.5B-Instruct
          MODEL_REVISION: 7ae557604adf67be50417f59c2c2f167def9a775
          CPUS: ${{ matrix.cpus }}
          RESERVED: ${{ matrix.reserved }}
        run: |
          export HF_CACHE=$HOME/hf-cache
          A=docker.io/vllm/vllm-openai-cpu:v0.19.1-x86_64@sha256:4c697ae650ebeb3a41f3c9c7020913d4c84d2729dc428ce39d60ca353975a4ce
          B=docker.io/vllm/vllm-openai-cpu:v0.20.0-x86_64@sha256:dc28ea3382c4cfe71be754fc1bbf66dc6c8e487afaae0b55d938c54bc158f363
          [ -d "$HF_CACHE/hub" ] || bash hack/first-request/fetch-model.sh "$A"
          for r in 1 2; do
            for v in v0.19.1 v0.20.0; do
              img=$A; [ $v = v0.20.0 ] && img=$B
              # reserved0: v0.20.0 with VLLM_CPU_NUM_OF_RESERVED_CPU=0, so the
              # scheduler core is not taken away from the OpenMP threads.
              STUDY_ENV=; [ "$RESERVED" = reserved0 ] && [ $v = v0.20.0 ] && STUDY_ENV=VLLM_CPU_NUM_OF_RESERVED_CPU=0
              STUDY_ENV=$STUDY_ENV bash hack/steady-study/study.sh "$img" eager "$CPUS" "out/$v-$CPUS-$r" > "out-$v-$r.log" 2>&1 || { tail -30 "out-$v-$r.log"; exit 1; }
              grep -h -i -E 'OpenMP thread binding|core ids|reserved_cpus|Selected CPU core number|executor' "out/$v-$CPUS-$r/vllm.log" | head -6 | sed "s/^/$v: /"
            done
          done
          python3 hack/steady-study/summarize.py out/* | tee table.txt
          { echo '```'; cat table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
