# Rehearsal measurement infra, NOT operator-owned: NodePort entry points for
# the load generator running on the host. kubectl port-forward pins to a
# single pod and does not follow endpoint changes, which would corrupt the
# make-before-break measurement; NodePort via kube-proxy tracks endpoints.
apiVersion: v1
kind: Service
metadata:
  name: rehearsal-0-np
  namespace: default
  labels: {rehearsal-infra: "true"}
spec:
  type: NodePort
  selector: {app: rehearsal-0}
  ports:
  - {name: http, port: 8000, targetPort: 8000, nodePort: 30800}
---
apiVersion: v1
kind: Service
metadata:
  name: rehearsal-1-np
  namespace: default
  labels: {rehearsal-infra: "true"}
spec:
  type: NodePort
  selector: {app: rehearsal-1}
  ports:
  - {name: http, port: 8000, targetPort: 8000, nodePort: 30801}
