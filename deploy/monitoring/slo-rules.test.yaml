# promtool test rules deploy/monitoring/slo-rules.test.yaml
rule_files: [slo-rules.yaml]
evaluation_interval: 1m
tests:
  # 90% of requests over 1 s in every window: both alerts fire.
  - interval: 1m
    input_series:
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="vllm-system",service="qwen-7b",le="1.0"}'
        values: '0+10x70'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="vllm-system",service="qwen-7b"}'
        values: '0+100x70'
    alert_rule_test:
      - eval_time: 10m
        alertname: VllmTtftBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page, namespace: vllm-system, service: qwen-7b}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md}
      - eval_time: 10m
        alertname: VllmTtftBudgetBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, namespace: vllm-system, service: qwen-7b}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md}
  # 2% over 1 s, inside the 5% budget: nothing fires.
  - interval: 1m
    input_series:
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="vllm-system",service="qwen-7b",le="1.0"}'
        values: '0+98x70'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="vllm-system",service="qwen-7b"}'
        values: '0+100x70'
    alert_rule_test:
      - {eval_time: 70m, alertname: VllmTtftBudgetBurnFast}
      - {eval_time: 70m, alertname: VllmTtftBudgetBurnSlow}
  # An hour at 2%, then ten minutes at 90%: only the short windows are high
  # (5m 0.9, 30m 0.31, 1h 0.17, 6h 0.15), so neither alert fires.
  - interval: 1m
    input_series:
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="vllm-system",service="qwen-7b",le="1.0"}'
        values: '0+98x60 5890+10x9'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="vllm-system",service="qwen-7b"}'
        values: '0+100x70'
    alert_rule_test:
      - {eval_time: 70m, alertname: VllmTtftBudgetBurnFast}
      - {eval_time: 70m, alertname: VllmTtftBudgetBurnSlow}
  # The simulator's Go client writes le="1": the same rule counts it.
  - interval: 1m
    input_series:
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="default",service="sim-fleet-a",le="1"}'
        values: '0+10x70'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="default",service="sim-fleet-a"}'
        values: '0+100x70'
    alert_rule_test:
      - eval_time: 10m
        alertname: VllmTtftBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page, namespace: default, service: sim-fleet-a}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md}
  # Same traffic, 20% over 1 s, three objectives: the team that declared p99
  # (budget 1%) is paged, p90 (budget 10%) and the undeclared default (5%) are not.
  - interval: 1m
    input_series:
      - series: 'vcso_vllmservice_objective_percentile{namespace="vllm-system",exported_namespace="team-demo",name="strict"}'
        values: '99x70'
      - series: 'vcso_vllmservice_objective_percentile{namespace="vllm-system",exported_namespace="team-demo",name="loose"}'
        values: '90x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="strict",le="1.0"}'
        values: '0+80x70'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="team-demo",service="strict"}'
        values: '0+100x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="loose",le="1.0"}'
        values: '0+80x70'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="team-demo",service="loose"}'
        values: '0+100x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="undeclared",le="1.0"}'
        values: '0+80x70'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="team-demo",service="undeclared"}'
        values: '0+100x70'
    alert_rule_test:
      - eval_time: 70m
        alertname: VllmTtftBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page, namespace: team-demo, service: strict}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md}
      - eval_time: 70m
        alertname: VllmTtftBudgetBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, namespace: team-demo, service: strict}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md}
  # 0.5 s is a bucket edge: measured there. 0.8 s is not: say so.
  - interval: 1m
    input_series:
      - series: 'vcso_vllmservice_objective_ttft_seconds{namespace="vllm-system",exported_namespace="team-demo",name="fast",le="0.5"}'
        values: '0.5x10'
      - series: 'vcso_vllmservice_objective_ttft_seconds{namespace="vllm-system",exported_namespace="team-demo",name="odd",le="0.8"}'
        values: '0.8x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: VllmTtftObjectiveUnsupported
        exp_alerts:
          - exp_labels: {severity: ticket, namespace: vllm-system, exported_namespace: team-demo, name: odd, le: "0.8"}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md}
  # Same traffic, three edges: 50% over 0.5 s, 20% over 1 s, 0% over 2.5 s.
  # Budget 5% for all; only the team that declared 0.5 s burns it (slow).
  - interval: 1m
    input_series:
      - series: 'vcso_vllmservice_objective_ttft_seconds{namespace="vllm-system",exported_namespace="team-demo",name="fast",le="0.5"}'
        values: '0.5x70'
      - series: 'vcso_vllmservice_objective_ttft_seconds{namespace="vllm-system",exported_namespace="team-demo",name="relaxed",le="2.5"}'
        values: '2.5x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="fast",le="0.5"}'
        values: '0+50x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="fast",le="1.0"}'
        values: '0+80x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="fast",le="2.5"}'
        values: '0+100x70'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="team-demo",service="fast"}'
        values: '0+100x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="relaxed",le="0.5"}'
        values: '0+50x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="relaxed",le="1.0"}'
        values: '0+80x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="relaxed",le="2.5"}'
        values: '0+100x70'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="team-demo",service="relaxed"}'
        values: '0+100x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="plain",le="0.5"}'
        values: '0+50x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="plain",le="1.0"}'
        values: '0+80x70'
      - series: 'vllm:time_to_first_token_seconds_bucket{namespace="team-demo",service="plain",le="2.5"}'
        values: '0+100x70'
      - series: 'vllm:time_to_first_token_seconds_count{namespace="team-demo",service="plain"}'
        values: '0+100x70'
    alert_rule_test:
      - eval_time: 70m
        alertname: VllmTtftBudgetBurnFast
        exp_alerts: []
      - eval_time: 70m
        alertname: VllmTtftBudgetBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, namespace: team-demo, service: fast}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md}
  # A replica down for six minutes.
  - interval: 1m
    input_series:
      - series: 'up{namespace="vllm-system",service="qwen-7b"}'
        values: '1 1 0x10'
    alert_rule_test:
      - {eval_time: 5m, alertname: VllmTargetDown}
      - eval_time: 8m
        alertname: VllmTargetDown
        exp_alerts:
          - exp_labels: {severity: ticket, namespace: vllm-system, service: qwen-7b}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md}
  # The operator asks for one replica of qwen-7b and its pod is gone from
  # minute 2: no up series at all, so only this alert can see it.
  - interval: 1m
    input_series:
      - series: 'vcso_vllmservice_desired_replicas{exported_namespace="vllm-system",namespace="vllm-system",name="qwen-7b"}'
        values: '1x45'
      - series: 'up{namespace="vllm-system",service="qwen-7b"}'
        values: '1 1'
    alert_rule_test:
      - {eval_time: 25m, alertname: VllmServiceReplicasMissing}
      - eval_time: 40m
        alertname: VllmServiceReplicasMissing
        exp_alerts:
          - exp_labels: {severity: ticket, exported_namespace: vllm-system, name: qwen-7b}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md}
  # Scaled to zero on purpose: it asks for 0 and has no pod. Nothing fires.
  - interval: 1m
    input_series:
      - series: 'vcso_vllmservice_desired_replicas{exported_namespace="vllm-system",namespace="vllm-system",name="qwen-7b"}'
        values: '0x45'
    alert_rule_test:
      - {eval_time: 40m, alertname: VllmServiceReplicasMissing}
  # One replica asked for and its pod answers. Nothing fires.
  - interval: 1m
    input_series:
      - series: 'vcso_vllmservice_desired_replicas{exported_namespace="vllm-system",namespace="vllm-system",name="qwen-7b"}'
        values: '1x45'
      - series: 'up{namespace="vllm-system",service="qwen-7b"}'
        values: '1x45'
    alert_rule_test:
      - {eval_time: 40m, alertname: VllmServiceReplicasMissing}
  # TPOT: 90% of requests over 100 ms in every window, both alerts fire.
  - interval: 1m
    input_series:
      - series: 'vllm:request_time_per_output_token_seconds_bucket{namespace="vllm-system",service="qwen-7b",le="0.1"}'
        values: '0+10x70'
      - series: 'vllm:request_time_per_output_token_seconds_count{namespace="vllm-system",service="qwen-7b"}'
        values: '0+100x70'
    alert_rule_test:
      - eval_time: 10m
        alertname: VllmTpotBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page, namespace: vllm-system, service: qwen-7b}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/tpot-and-success-burn-rate.md}
      - eval_time: 10m
        alertname: VllmTpotBudgetBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, namespace: vllm-system, service: qwen-7b}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/tpot-and-success-burn-rate.md}
  # TPOT: 2% over 100 ms, inside the 5% budget: nothing fires.
  - interval: 1m
    input_series:
      - series: 'vllm:request_time_per_output_token_seconds_bucket{namespace="vllm-system",service="qwen-7b",le="0.1"}'
        values: '0+98x70'
      - series: 'vllm:request_time_per_output_token_seconds_count{namespace="vllm-system",service="qwen-7b"}'
        values: '0+100x70'
    alert_rule_test:
      - {eval_time: 70m, alertname: VllmTpotBudgetBurnFast}
      - {eval_time: 70m, alertname: VllmTpotBudgetBurnSlow}
  # Success: 10% aborted in every window, both alerts fire.
  - interval: 1m
    input_series:
      - series: 'vllm:request_success_total{namespace="vllm-system",service="qwen-7b",finished_reason="abort"}'
        values: '0+10x70'
      - series: 'vllm:request_success_total{namespace="vllm-system",service="qwen-7b",finished_reason="stop"}'
        values: '0+90x70'
    alert_rule_test:
      - eval_time: 10m
        alertname: VllmSuccessBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page, namespace: vllm-system, service: qwen-7b}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/tpot-and-success-burn-rate.md}
      - eval_time: 10m
        alertname: VllmSuccessBudgetBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, namespace: vllm-system, service: qwen-7b}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/tpot-and-success-burn-rate.md}
  # Success: 0.2% aborted, inside the 0.5% budget: nothing fires.
  - interval: 1m
    input_series:
      - series: 'vllm:request_success_total{namespace="vllm-system",service="qwen-7b",finished_reason="abort"}'
        values: '0+2x70'
      - series: 'vllm:request_success_total{namespace="vllm-system",service="qwen-7b",finished_reason="stop"}'
        values: '0+998x70'
    alert_rule_test:
      - {eval_time: 70m, alertname: VllmSuccessBudgetBurnFast}
      - {eval_time: 70m, alertname: VllmSuccessBudgetBurnSlow}
