# Burn-rate alerts on the time to first token objective of ADR-0013: 95% of
# requests with a first token within 1 s, so an error budget of 5%. Rules in
# the Prometheus format, the same file for promtool, the CI Prometheus and the
# Grafana-managed rules of Grafana Cloud (ADR-0021). The 1 s edge is a bucket of
# vllm:time_to_first_token_seconds in vLLM v0.11.0 and in the simulator
# v0.8.2; Go writes le="1", Python le="1.0". Windows and factors are the
# multiwindow, multi-burn-rate alerts of the Google SRE Workbook.
groups:
  - name: vllm-ttft-slo
    rules:
      # Share of requests over each bucket edge, per service. vLLM (Python)
      # writes le="1.0", the simulator (Go) le="1": both become "1".
      - record: slo:ttft_over_le:ratio_rate5m
        expr: 1 - sum by (namespace, service, le) (label_replace(rate(vllm:time_to_first_token_seconds_bucket[5m]), "le", "$1", "le", "(.+)\\.0")) / on (namespace, service) group_left sum by (namespace, service) (rate(vllm:time_to_first_token_seconds_count[5m]))
      - record: slo:ttft_over_le:ratio_rate30m
        expr: 1 - sum by (namespace, service, le) (label_replace(rate(vllm:time_to_first_token_seconds_bucket[30m]), "le", "$1", "le", "(.+)\\.0")) / on (namespace, service) group_left sum by (namespace, service) (rate(vllm:time_to_first_token_seconds_count[30m]))
      - record: slo:ttft_over_le:ratio_rate1h
        expr: 1 - sum by (namespace, service, le) (label_replace(rate(vllm:time_to_first_token_seconds_bucket[1h]), "le", "$1", "le", "(.+)\\.0")) / on (namespace, service) group_left sum by (namespace, service) (rate(vllm:time_to_first_token_seconds_count[1h]))
      - record: slo:ttft_over_le:ratio_rate6h
        expr: 1 - sum by (namespace, service, le) (label_replace(rate(vllm:time_to_first_token_seconds_bucket[6h]), "le", "$1", "le", "(.+)\\.0")) / on (namespace, service) group_left sum by (namespace, service) (rate(vllm:time_to_first_token_seconds_count[6h]))
      # The edge each service is judged at: the ttftSeconds its team declared,
      # exported by the operator as the le label of the objective gauge.
      - record: slo:ttft_objective_le:info
        expr: max by (namespace, service, le) (label_replace(label_replace(vcso_vllmservice_objective_ttft_seconds, "namespace", "$1", "exported_namespace", "(.*)"), "service", "$1", "name", "(.*)")) * 0 + 1
      # Share over the declared edge; 1 s (ADR-0013) when none is declared or
      # the declared one is not a bucket edge (then VllmTtftObjectiveUnsupported).
      - record: slo:ttft_over_objective:ratio_rate5m
        expr: |
          max by (namespace, service) (slo:ttft_over_le:ratio_rate5m and on (namespace, service, le) slo:ttft_objective_le:info)
          or on (namespace, service)
          max by (namespace, service) (slo:ttft_over_le:ratio_rate5m{le="1"})
      - record: slo:ttft_over_objective:ratio_rate30m
        expr: |
          max by (namespace, service) (slo:ttft_over_le:ratio_rate30m and on (namespace, service, le) slo:ttft_objective_le:info)
          or on (namespace, service)
          max by (namespace, service) (slo:ttft_over_le:ratio_rate30m{le="1"})
      - record: slo:ttft_over_objective:ratio_rate1h
        expr: |
          max by (namespace, service) (slo:ttft_over_le:ratio_rate1h and on (namespace, service, le) slo:ttft_objective_le:info)
          or on (namespace, service)
          max by (namespace, service) (slo:ttft_over_le:ratio_rate1h{le="1"})
      - record: slo:ttft_over_objective:ratio_rate6h
        expr: |
          max by (namespace, service) (slo:ttft_over_le:ratio_rate6h and on (namespace, service, le) slo:ttft_objective_le:info)
          or on (namespace, service)
          max by (namespace, service) (slo:ttft_over_le:ratio_rate6h{le="1"})
      # The error budget of each service: 1 - percentile/100 of the objective its
      # team declared (spec.objective, exported by the operator with the
      # object's namespace as exported_namespace), else the 5% of ADR-0013.
      - record: slo:ttft_error_budget:ratio
        expr: |
          (1 - max by (namespace, service) (label_replace(label_replace(vcso_vllmservice_objective_percentile, "namespace", "$1", "exported_namespace", "(.*)"), "service", "$1", "name", "(.*)")) / 100)
          or on (namespace, service)
          (0 * slo:ttft_over_objective:ratio_rate1h + 0.05)
      - alert: VllmTtftBudgetBurnFast
        # 14.4 times the budget: 2% of a 30-day budget in one hour.
        expr: slo:ttft_over_objective:ratio_rate1h > 14.4 * slo:ttft_error_budget:ratio and slo:ttft_over_objective:ratio_rate5m > 14.4 * slo:ttft_error_budget:ratio
        labels:
          severity: page
        annotations:
          runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md
      - alert: VllmTtftBudgetBurnSlow
        # 6 times the budget: 5% of a 30-day budget in six hours.
        expr: slo:ttft_over_objective:ratio_rate6h > 6 * slo:ttft_error_budget:ratio and slo:ttft_over_objective:ratio_rate30m > 6 * slo:ttft_error_budget:ratio
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md
      - alert: VllmTtftObjectiveUnsupported
        # The 22 edges of vllm:time_to_first_token_seconds in vLLM v0.11.0
        # (vllm/v1/metrics/loggers.py) and the simulator v0.8.2. An objective at
        # another value would be measured at 1 s, so say it.
        expr: vcso_vllmservice_objective_ttft_seconds{le!~"0.001|0.005|0.01|0.02|0.04|0.06|0.08|0.1|0.25|0.5|0.75|1|2.5|5|7.5|10|20|40|80|160|640|2560"}
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md
  # Time per output token (ADR-0026): share of requests whose mean time per
  # output token is over 100 ms, from the per-request histogram of vLLM v0.11.0
  # (bucket edge 0.1). Absent from the simulator v0.8.2. Budget 5% (95% within).
  - name: vllm-tpot-slo
    rules:
      - record: slo:tpot_over_100ms:ratio_rate5m
        expr: 1 - sum by (namespace, service) (rate(vllm:request_time_per_output_token_seconds_bucket{le="0.1"}[5m])) / sum by (namespace, service) (rate(vllm:request_time_per_output_token_seconds_count[5m]))
      - record: slo:tpot_over_100ms:ratio_rate30m
        expr: 1 - sum by (namespace, service) (rate(vllm:request_time_per_output_token_seconds_bucket{le="0.1"}[30m])) / sum by (namespace, service) (rate(vllm:request_time_per_output_token_seconds_count[30m]))
      - record: slo:tpot_over_100ms:ratio_rate1h
        expr: 1 - sum by (namespace, service) (rate(vllm:request_time_per_output_token_seconds_bucket{le="0.1"}[1h])) / sum by (namespace, service) (rate(vllm:request_time_per_output_token_seconds_count[1h]))
      - record: slo:tpot_over_100ms:ratio_rate6h
        expr: 1 - sum by (namespace, service) (rate(vllm:request_time_per_output_token_seconds_bucket{le="0.1"}[6h])) / sum by (namespace, service) (rate(vllm:request_time_per_output_token_seconds_count[6h]))
      - alert: VllmTpotBudgetBurnFast
        # 14.4 times the budget: 2% of a 30-day budget in one hour.
        expr: slo:tpot_over_100ms:ratio_rate1h > 14.4 * 0.05 and slo:tpot_over_100ms:ratio_rate5m > 14.4 * 0.05
        labels:
          severity: page
        annotations:
          runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/tpot-and-success-burn-rate.md
      - alert: VllmTpotBudgetBurnSlow
        # 6 times the budget: 5% of a 30-day budget in six hours.
        expr: slo:tpot_over_100ms:ratio_rate6h > 6 * 0.05 and slo:tpot_over_100ms:ratio_rate30m > 6 * 0.05
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/tpot-and-success-burn-rate.md
  # Success (ADR-0026): share of finished requests with finished_reason abort,
  # the only failure vLLM v0.11.0 labels (stop, length, abort). Abort also counts
  # a client that disconnects; requests lost before the replica are not seen.
  # Budget 0.5% (99.5% success).
  - name: vllm-success-slo
    rules:
      - record: slo:request_aborted:ratio_rate5m
        expr: sum by (namespace, service) (rate(vllm:request_success_total{finished_reason="abort"}[5m])) / sum by (namespace, service) (rate(vllm:request_success_total[5m]))
      - record: slo:request_aborted:ratio_rate30m
        expr: sum by (namespace, service) (rate(vllm:request_success_total{finished_reason="abort"}[30m])) / sum by (namespace, service) (rate(vllm:request_success_total[30m]))
      - record: slo:request_aborted:ratio_rate1h
        expr: sum by (namespace, service) (rate(vllm:request_success_total{finished_reason="abort"}[1h])) / sum by (namespace, service) (rate(vllm:request_success_total[1h]))
      - record: slo:request_aborted:ratio_rate6h
        expr: sum by (namespace, service) (rate(vllm:request_success_total{finished_reason="abort"}[6h])) / sum by (namespace, service) (rate(vllm:request_success_total[6h]))
      - alert: VllmSuccessBudgetBurnFast
        # 14.4 times the budget: 2% of a 30-day budget in one hour.
        expr: slo:request_aborted:ratio_rate1h > 14.4 * 0.005 and slo:request_aborted:ratio_rate5m > 14.4 * 0.005
        labels:
          severity: page
        annotations:
          runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/tpot-and-success-burn-rate.md
      - alert: VllmSuccessBudgetBurnSlow
        # 6 times the budget: 5% of a 30-day budget in six hours.
        expr: slo:request_aborted:ratio_rate6h > 6 * 0.005 and slo:request_aborted:ratio_rate30m > 6 * 0.005
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/tpot-and-success-burn-rate.md
  - name: vllm-targets
    rules:
      - alert: VllmTargetDown
        # A replica whose /metrics stops answering also stops counting
        # against the budget; this says so.
        expr: up{service!=""} == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md
      - alert: VllmServiceReplicasMissing
        # The operator asks for replicas and no /metrics target answers for
        # them: a pod that vanished, whose up series VllmTargetDown cannot see
        # because it is gone. The operator's series carry the object's
        # namespace as exported_namespace, since the scrape writes its own
        # pod's namespace (Grafana Cloud stack, read 2026-10-28). A service
        # scaled to zero asks for 0 and stays silent (ADR-0023).
        # 30 m: longer than the 20 min 40 s cold start of one L4 (B-005), so
        # a replica still waiting for its node is not yet missing.
        expr: |
          max by (exported_namespace, name) (vcso_vllmservice_desired_replicas) > 0
          unless on (exported_namespace, name)
          label_replace(label_replace(max by (namespace, service) (up{service!=""}), "exported_namespace", "$1", "namespace", "(.*)"), "name", "$1", "service", "(.*)")
        for: 30m
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/vllm-coldstart-operator/blob/main/docs/runbooks/ttft-burn-rate.md
