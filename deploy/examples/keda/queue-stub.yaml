# A queue-depth endpoint that is not vLLM, so the scale-to-zero path can be
# rehearsed on kind without a GPU. Serves whatever the ConfigMap holds:
#   kubectl create configmap queue-stub-cfg \
#     --from-literal=queue.json='{"waiting": 4}' --dry-run=client -o yaml \
#     | kubectl apply -f - && kubectl rollout restart deployment/queue-stub
# In a real deployment the trigger reads vLLM's own num_requests_waiting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: queue-stub-cfg
data:
  queue.json: '{"waiting": 0}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-stub
spec:
  replicas: 1
  selector:
    matchLabels: {app: queue-stub}
  template:
    metadata:
      labels: {app: queue-stub}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: cfg, mountPath: /usr/share/nginx/html}
      volumes:
        - name: cfg
          configMap:
            name: queue-stub-cfg
            items: [{key: queue.json, path: queue}]
---
apiVersion: v1
kind: Service
metadata:
  name: queue-stub
spec:
  selector: {app: queue-stub}
  ports: [{port: 80, targetPort: 80}]
