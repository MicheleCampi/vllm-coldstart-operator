# Scale-to-zero for a FleetService, driven by KEDA.
#
# Perimeter: KEDA handles the transitions to and from zero by writing the
# scale subresource directly, which is all ADR-0009 D1 provides and all
# this needs. maxReplicaCount stays 1 because this example is the zero
# round trip; scaling 1 -> N goes through the HPA, which accepts a fleet
# since ADR-0014 gave it a selector, and scaledobject-scale-out.yaml is
# that example.
#
# The trigger here reads a queue-depth endpoint. In a real deployment that
# is the vLLM `/metrics` scrape or an aggregator over it; the stub in this
# directory exists so the behaviour can be rehearsed without a GPU.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ci-fleet-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: inference.michelecampi.dev/v1alpha1
    kind: FleetService
    name: ci-fleet
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 10
  # Cooldown before draining: in eager mode a 7B replica on an A10 took
  # 11.7 to 19.0 s just to construct its engine (vllm-coldstart-probe,
  # analysis/CAPTURES.md), so idling early is not free.
  cooldownPeriod: 20
  initialCooldownPeriod: 20
  triggers:
    - type: metrics-api
      metadata:
        url: "http://queue-stub.default.svc.cluster.local/queue"
        valueLocation: "waiting"
        # Any waiting request activates the fleet; targetValue only
        # matters for the HPA path, which does not run here.
        activationTargetValue: "0"
        targetValue: "2"
