# CPU-only serving, no GPU: gpu 0 with cpu and memory both set makes the
# operator run `vllm serve` on the vLLM CPU release image v0.34.0 (an x86
# node with AVX-512). Without cpu or memory, gpu 0 stays the inert placeholder of
# ci-placeholder.yaml. Memory is request = limit. The vLLM CPU image
# reserves VLLM_CPU_KVCACHE_SPACE GiB of KV cache (4 by default, no CLI
# flag): 4.9 GiB used in docker with a 6 GB limit, but OOMKilled on EKS at
# 6Gi (live #3, 2026-11-17). 1 GiB holds ~87k tokens, ample for
# --max-model-len 2048, and leaves headroom under the limit.
apiVersion: inference.michelecampi.dev/v1alpha1
kind: VllmService
metadata:
  name: qwen-0-5b-cpu
  namespace: default
spec:
  model: Qwen/Qwen2.5-0.5B-Instruct
  replicas: 1
  warmupStrategy: Eager
  image: docker.io/vllm/vllm-openai-cpu:v0.34.0-x86_64@sha256:b14c3a46a4b08852b32528643e070d57f3731cccb0fa33ef86d4f3b3f8ac36c4
  gpu: 0
  cpu: "1"
  memory: 6Gi
  healthPath: /health
  extraArgs: ["--max-model-len", "2048", "--dtype", "bfloat16"]
  env:
    - name: VLLM_CPU_KVCACHE_SPACE
      value: "1"
