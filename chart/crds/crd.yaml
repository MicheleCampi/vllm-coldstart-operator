apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vllmservices.inference.michelecampi.dev
spec:
  group: inference.michelecampi.dev
  names:
    categories: []
    kind: VllmService
    plural: vllmservices
    shortNames:
    - vllm
    singular: vllmservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for VllmServiceSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Desired state for a vLLM inference service.

              The cold-start-aware field (`warmup_strategy`) is what makes this
              operator different from a generic Deployment wrapper: the operator
              treats time-to-first-token as a first-class concern, configuring the
              pod for the cold-start/throughput trade-off the spec asks for.
            properties:
              extraArgs:
                default: []
                description: |-
                  Extra command-line arguments appended to `vllm serve <model>`, e.g.
                  ["--max-model-len", "8192", "--gpu-memory-utilization", "0.90"].
                  Keeps engine tuning (context length, memory fraction, quantization)
                  in the resource spec rather than baked into the operator binary.
                items:
                  type: string
                type: array
              gpu:
                default: 1
                description: |-
                  Number of GPUs to request per replica. Set to 0 for CPU-only or
                  placeholder runs (e.g. CI on a cluster without GPUs).
                format: int32
                type: integer
              healthPath:
                default: /health
                description: |-
                  HTTP path for the readiness probe, e.g. "/health". When non-empty,
                  the operator gates readiness (and thus the Warming->Ready transition)
                  on this endpoint, so "Ready" means the server can actually serve.
                  Set to an empty string to disable the probe entirely, for inert
                  placeholder images that expose no HTTP health endpoint.
                type: string
              image:
                default: vllm/vllm-openai:latest
                description: Container image to run. Defaults to the official vLLM OpenAI server.
                type: string
              model:
                description: HuggingFace model id to serve, e.g. "Qwen/Qwen2.5-7B-Instruct".
                type: string
              modelCacheHostPath:
                description: |-
                  Host directory mounted at the container's HuggingFace cache
                  (/root/.cache/huggingface). Point it at a node-local path holding a
                  pre-downloaded model so a cold start loads weights from local disk
                  instead of re-downloading them from the HF CDN, making reschedule
                  latency an operator property rather than a network property. Unset
                  (the default) keeps the download-in-pod behaviour. hostPath-backed:
                  meant for single-tenant benchmark/edge clusters, not multi-tenant
                  production.
                nullable: true
                type: string
              nodeName:
                description: |-
                  Exact node this replica must land on, as a `kubernetes.io/hostname`
                  nodeSelector. Set by the fleet controller (ADR-0004) to pin a placement
                  to its chosen node while keeping the default scheduler in the loop
                  (resource fit, admission, taint/toleration). Unset for standalone /
                  CI use, where no node constraint is emitted.
                nullable: true
                type: string
              replicas:
                default: 1
                description: Number of replicas to run.
                format: int32
                type: integer
              runtimeClassName:
                description: |-
                  RuntimeClass for the workload pod. Cluster-dependent: K3s GPU nodes
                  need "nvidia" to route the pod to the NVIDIA container runtime, while
                  managed clusters (GKE, EKS, AKS) expose GPUs through the device plugin
                  with the default runtime and define no such RuntimeClass. Leave unset
                  (the default) on managed clusters; setting a non-existent RuntimeClass
                  makes the API server reject the pod.
                nullable: true
                type: string
              warmupStrategy:
                default: Eager
                description: |-
                  Cold-start vs throughput trade-off. "eager" disables CUDA graphs
                  for a faster cold start (better for scale-to-zero); "graph" enables
                  them for faster steady-state inference at a higher cold-start cost.
                enum:
                - Eager
                - Graph
                type: string
            required:
            - model
            type: object
          status:
            description: Observed state, written back by the operator.
            nullable: true
            properties:
              message:
                description: Human-readable detail about the current phase.
                type: string
              phase:
                description: 'Lifecycle phase: Pending -> Warming -> Ready.'
                type: string
            required:
            - message
            - phase
            type: object
        required:
        - spec
        title: VllmService
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetservices.inference.michelecampi.dev
spec:
  group: inference.michelecampi.dev
  names:
    categories: []
    kind: FleetService
    plural: fleetservices
    shortNames:
    - fleet
    singular: fleetservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for FleetServiceSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Desired state for a fleet of vLLM services scheduled across nodes.

              `FleetService` does not manage warmup lifecycle itself — that stays owned
              by `VllmService`, already validated E2E on GKE. This CRD owns placement:
              which node runs which instance, and how the fleet reacts to node-level
              state (warmth, load, spot preemption) that only exists once you have more
              than one node. Deployment -> ReplicaSet -> Pod is the model: FleetService
              creates and reconciles owned VllmService objects, it does not replace
              their reconciler.
            properties:
              hysteresis:
                default:
                  maxConcurrentReschedules: 1
                  stableReconcilesRequired: 3
                description: Anti-oscillation controls for the reconcile loop.
                properties:
                  maxConcurrentReschedules:
                    default: 1
                    description: |-
                      Max simultaneous reschedules across the fleet, analogous to
                      maxUnavailable. Caps blast radius of a bad placement decision.
                    format: int32
                    type: integer
                  stableReconcilesRequired:
                    default: 3
                    description: |-
                      Consecutive reconciles a node-state category must persist before the
                      controller acts on it. Prevents flapping on a single noisy sample.
                    format: int32
                    type: integer
                type: object
              model:
                description: HuggingFace model id, passed through to every owned VllmService.
                type: string
              nodePool:
                default:
                  selector: {}
                  spotPolicy:
                    enabled: false
                    maxSpotFraction: 0.0
                description: Node pool this fleet is allowed to place onto.
                properties:
                  selector:
                    additionalProperties:
                      type: string
                    default: {}
                    description: Label selector for nodes this fleet may place onto.
                    type: object
                  spotPolicy:
                    default:
                      enabled: false
                      maxSpotFraction: 0.0
                    properties:
                      enabled:
                        default: false
                        type: boolean
                      maxSpotFraction:
                        default: 0.5
                        description: Max fraction of fleet replicas allowed on spot nodes, 0.0-1.0.
                        format: float
                        type: number
                    type: object
                type: object
              placement:
                default:
                  strategy: WarmthFirst
                description: |-
                  Placement strategy. WarmthFirst (default) and EfficiencyAware
                  (ADR-0007) are implemented; Spread/BinPack are reserved variants
                  that currently degrade to warmth-first (see ADR).
                properties:
                  strategy:
                    default: WarmthFirst
                    enum:
                    - WarmthFirst
                    - Spread
                    - BinPack
                    - EfficiencyAware
                    type: string
                type: object
              replicas:
                description: Desired replica count at fleet level (across all nodes).
                format: int32
                type: integer
              template:
                description: |-
                  VllmService template applied to every placement. Same shape as
                  VllmServiceSpec minus `model`/`replicas`, which the fleet controls.
                properties:
                  extraArgs:
                    default: []
                    items:
                      type: string
                    type: array
                  gpu:
                    default: 1
                    format: int32
                    type: integer
                  healthPath:
                    default: /health
                    type: string
                  image:
                    default: vllm/vllm-openai:latest
                    description: |-
                      Container image for every owned VllmService. Pin a digest or exact
                      tag for reproducible fleets; the default (vllm/vllm-openai:latest)
                      exists for interactive convenience only and is not a reproducible
                      reference.
                    type: string
                  modelCacheHostPath:
                    description: |-
                      Host directory mounted at the container's HuggingFace cache on every
                      owned VllmService. See VllmServiceSpec.modelCacheHostPath.
                    nullable: true
                    type: string
                  runtimeClassName:
                    nullable: true
                    type: string
                type: object
            required:
            - model
            - replicas
            - template
            type: object
          status:
            description: Observed state, written back by the fleet controller.
            nullable: true
            properties:
              activeReschedules:
                description: Counter backing the max_concurrent_reschedules cap.
                format: int32
                type: integer
              desiredReplicas:
                format: int32
                type: integer
              phase:
                description: 'Aggregated phase: worst-case across all placements.'
                type: string
              placements:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: RFC3339 timestamp of the last phase transition.
                      type: string
                    nodeRef:
                      type: string
                    phase:
                      type: string
                    stableSince:
                      default: ''
                      description: |-
                        RFC3339 timestamp since the current phase has held stable, used for
                        hysteresis. None-equivalent is an empty string (kept JsonSchema-simple
                        rather than Option<String> to avoid an extra null branch in the CRD
                        schema).
                      type: string
                    vllmServiceRef:
                      type: string
                  required:
                  - lastTransitionTime
                  - nodeRef
                  - phase
                  - vllmServiceRef
                  type: object
                type: array
              readyReplicas:
                format: int32
                type: integer
            required:
            - activeReschedules
            - desiredReplicas
            - phase
            - readyReplicas
            type: object
        required:
        - spec
        title: FleetService
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodestates.inference.michelecampi.dev
spec:
  group: inference.michelecampi.dev
  names:
    categories: []
    kind: NodeState
    plural: nodestates
    shortNames:
    - nstate
    singular: nodestate
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for NodeStateSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Desired state observed for a single node, written by a per-node reporter
              DaemonSet (outside this operator's binary) and read by FleetController.
              Kept separate from core Node objects: mutating Node annotations directly
              risks collision with cluster-autoscaler and other node controllers.
            properties:
              reportIntervalSeconds:
                default: 15
                description: Cadence at which the reporter refreshes status, in seconds.
                format: int32
                type: integer
            type: object
          status:
            description: Observed state for a single node, written by the per-node reporter.
            nullable: true
            properties:
              activeServiceCount:
                default: 0
                format: int32
                type: integer
              gpuMemoryUsedBytes:
                default: 0
                format: int64
                type: integer
              gpuUtilization:
                default: 0.0
                format: float
                type: number
              kvCacheHitRate:
                description: |-
                  ADR-0007: raw observed KV-cache hit-rate in [0,1], written by the
                  per-node reporter. Absent = signal not available (fail-open).
                format: float
                nullable: true
                type: number
              lastReportTime:
                default: ''
                description: RFC3339 timestamp of the last reporter write.
                type: string
              observedGeneration:
                default: 0
                description: |-
                  Every status field is schema-optional (serde defaults): the status
                  is merge-patched by writers with disjoint field ownership (reporter
                  vs warmth/spot writers), and a required field would force every
                  writer to fabricate values it does not own on first write.
                format: int64
                type: integer
              spot:
                default:
                  isSpotInstance: false
                  preemptionNoticeDetected: false
                  preemptionNoticeTime: ''
                properties:
                  isSpotInstance:
                    default: false
                    type: boolean
                  preemptionNoticeDetected:
                    default: false
                    type: boolean
                  preemptionNoticeTime:
                    default: ''
                    description: RFC3339 timestamp; empty string until a notice is first detected.
                    type: string
                type: object
              tokensPerJoule:
                description: |-
                  ADR-0007: raw observed tokens-per-joule, written by the per-node
                  reporter. Absent = signal not available (fail-open).
                format: float
                nullable: true
                type: number
              warmth:
                default: Cold
                enum:
                - Cold
                - Warming
                - Warm
                type: string
            type: object
        required:
        - spec
        title: NodeState
        type: object
    served: true
    storage: true
    subresources:
      status: {}
