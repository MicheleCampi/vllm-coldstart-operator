{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: {{ include "vllm-coldstart-operator.fullname" . }}
  labels:
    {{- include "vllm-coldstart-operator.labels" . | nindent 4 }}
rules:
# Watch VllmService custom resources across all namespaces (Api::all).
# create/patch: the fleet controller server-side applies one owned
# VllmService per placement slot. delete: scale-down removes the children
# beyond spec.replicas (ADR-0009 D4) — owner references only garbage-collect
# when the whole FleetService goes away, not when it shrinks.
- apiGroups: ["inference.michelecampi.dev"]
  resources: ["vllmservices"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
# Write lifecycle phase back on the /status subresource.
- apiGroups: ["inference.michelecampi.dev"]
  resources: ["vllmservices/status"]
  verbs: ["get", "patch", "update"]
# Server-side apply the owned Deployment and watch owned children (.owns).
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "patch"]
# The main controller also applies a Service per VllmService (ADR-0005).
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "patch"]
# Fleet controller: watches FleetService across namespaces (Api::all) and
# writes phase/placements back on /status.
- apiGroups: ["inference.michelecampi.dev"]
  resources: ["fleetservices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["inference.michelecampi.dev"]
  resources: ["fleetservices/status"]
  verbs: ["get", "patch", "update"]
# Fleet controller reads NodeState fleet-wide (planner input + .watches
# mapper). Status writes belong to the reporter, not the operator.
- apiGroups: ["inference.michelecampi.dev"]
  resources: ["nodestates"]
  verbs: ["get", "list", "watch"]
# ADR-0008 D3: the fleet planner reads node allocatable to exclude nodes that
# cannot run a GPU-requesting pod. Read-only and list-only — the operator never
# writes to Node, and a placement decision needs the capacity of every node it
# might choose, so this cannot be namespaced.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: {{ include "vllm-coldstart-operator.fullname" . }}
  labels:
    {{- include "vllm-coldstart-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vllm-coldstart-operator.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "vllm-coldstart-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
