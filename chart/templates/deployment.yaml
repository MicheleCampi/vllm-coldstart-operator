apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: {{ include "vllm-coldstart-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vllm-coldstart-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Single-replica controller with no leader election: a RollingUpdate
  # surges a second pod before the old one exits, so two reconcilers
  # would briefly race on placement decisions. Recreate keeps exactly one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vllm-coldstart-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vllm-coldstart-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vllm-coldstart-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: "{{ include "vllm-coldstart-operator.image" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: RUST_LOG
          value: {{ .Values.logLevel | quote }}
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 3
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
