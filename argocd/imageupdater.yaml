apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: vllm-coldstart-operator
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/git-creds"
    gitConfig:
      repository: "https://github.com/MicheleCampi/vllm-coldstart-operator"
      branch: "main"
      writeBackTarget: "helmvalues:chart/values.yaml"
  applicationRefs:
    - namePattern: "vllm-coldstart-operator"
      images:
        - alias: "operator"
          imageName: "ghcr.io/michelecampi/vllm-coldstart-operator"
          commonUpdateSettings:
            updateStrategy: "newest-build"
            allowTags: "regexp:^[0-9a-f]{7}$"
            platforms:
              - "linux/amd64"
          manifestTargets:
            helm:
              tag: "image.tag"
