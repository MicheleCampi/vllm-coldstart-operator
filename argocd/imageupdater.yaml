apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: vllm-coldstart-operator
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/git-creds"
    gitConfig:
      repository: "https://github.com/MicheleCampi/vllm-coldstart-operator"
      branch: "main"
      # Leading slash = path relative to the repository root. Without it the
      # target resolves against the Application's spec.source.path (= "chart"),
      # which wrote updates to chart/chart/values.yaml instead.
      writeBackTarget: "helmvalues:/chart/values.yaml"
  applicationRefs:
    - namePattern: "vllm-coldstart-operator"
      images:
        - alias: "operator"
          imageName: "ghcr.io/michelecampi/vllm-coldstart-operator"
          commonUpdateSettings:
            updateStrategy: "semver"
            allowTags: 'regexp:^[0-9]+\.[0-9]+\.[0-9]+$'
            platforms:
              - "linux/amd64"
          manifestTargets:
            helm:
              # Written as a single full image reference into image.spec, which
              # the chart's image helper uses verbatim when set (falling back to
              # repository/tag otherwise).
              spec: "image.spec"
